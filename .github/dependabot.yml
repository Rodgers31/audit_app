# Two routine review queues; security updates use separate groups and limits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    # GitHub documents allow.update-types as version-update-only. Urgent security
    # fixes may therefore require a major version even with this routine policy.
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    commit-message: {prefix: build, include: scope}
    groups:
      frontend-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /backend
      - /etl
      - /tools/worker_host_fixture
      - /docs/admin/batch66
      - /docs/admin/batch71
      - /docs/admin/batch80
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Chicago
    versioning-strategy: increase
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    commit-message: {prefix: build, include: scope}
    groups:
      python-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
