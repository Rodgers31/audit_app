# Manual-only verification while automatic development workflows remain disabled.
# Full scope keeps all seven ci.yml contracts; backend scope skips the other jobs.
# Offline controls permit only the explicit scope conditions and frozen checkout guard.
# Disable this workflow and repository Actions again immediately after the approved run.
name: Bounded manual verification
run-name: Manual verification [${{ inputs.verification_scope }}] ${{ inputs.commit_sha }}
'on':
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Approved immutable commit SHA; must match the selected dispatch ref
        required: true
        type: string
      verification_scope:
        description: 'full: all seven CI jobs; backend: backend only, full quality gate skipped'
        required: true
        default: full
        type: choice
        options:
        - full
        - backend
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: bounded-manual-verification
  cancel-in-progress: false
jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_app_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries
          5
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: 'cd backend

        python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install -r requirements-dev.txt

        '
    - name: Lint with flake8 (Critical Errors Only)
      run: 'cd backend

        # Fail on critical errors (syntax errors, undefined names, etc.)

        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git

        '
    - name: Prepare pinned owned PostgreSQL test images
      timeout-minutes: 5
      run: python .github/scripts/prepare_postgres_test_images.py
    - name: Run Core Backend Tests (REQUIRED)
      id: backend_tests
      run: "cd backend\n# Run unit tests (exclude integration tests that require real DB)\npytest tests/\
        \ --ignore=tests/integration --verbose --maxfail=5 \\\n  --cov=. --cov-report=xml --cov-report=html\
        \ --cov-report=term \\\n  -m \"not slow\"\n"
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audit_app_test
        REDIS_URL: redis://localhost:6379
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}/backend
    - name: Check Test Coverage Threshold
      id: local_coverage
      continue-on-error: true
      run: "cd backend\nif [ -f coverage.xml ]; then\n  COVERAGE=$(python -c \"import xml.etree.ElementTree\
        \ as ET; root = ET.parse('coverage.xml').getroot(); print(float(root.attrib['line-rate']) * 100)\"\
        )\n  echo \"Test Coverage: ${COVERAGE}%\"\nelse\n  echo \"\u26A0\uFE0F No coverage.xml found,\
        \ skipping check\"\nfi\n"
    - name: Test workflow boundaries and optional coverage reporting
      run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
    - name: Prepare optional Codecov upload
      id: coverage_upload_prepare
      continue-on-error: true
      run: python .github/scripts/coverage_upload.py prepare
      env:
        CODECOV_UPLOAD_ENABLED: ${{ vars.CODECOV_UPLOAD_ENABLED }}
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Attempt optional Codecov upload (hosted report unverified)
      id: coverage_upload
      if: steps.coverage_upload_prepare.outputs.status == 'ready'
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        files: backend/coverage.xml
        disable_search: true
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Report optional hosted coverage outcome
      if: always()
      run: python .github/scripts/coverage_upload.py report
      env:
        UPLOAD_STATUS: ${{ steps.coverage_upload_prepare.outputs.status }}
        UPLOAD_OUTCOME: ${{ steps.coverage_upload.outcome }}
        COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        TEST_OUTCOME: ${{ steps.backend_tests.outcome }}
        LOCAL_COVERAGE_OUTCOME: ${{ steps.local_coverage.outcome }}
    - name: Validate API Health Check
      run: "cd backend\n# Quick smoke test - ensure main app can import\npython -c \"from main import\
        \ app; print('\u2705 App imports successfully')\"\n"
  test-frontend:
    if: ${{ inputs.verification_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: 'cd frontend

        npm ci

        '
    - name: Lint (REQUIRED - No Warnings)
      run: 'cd frontend

        # Fail if there are any linting errors or warnings

        npm run lint -- --max-warnings=0

        '
    - name: Type Check (REQUIRED)
      run: 'cd frontend

        # Ensure TypeScript compilation succeeds

        npx tsc --noEmit

        '
    - name: Run Unit Tests (REQUIRED)
      run: 'cd frontend

        # Run Jest/Vitest unit tests

        npm test -- --ci --coverage --passWithNoTests

        '
    - name: Build (REQUIRED)
      run: 'cd frontend

        # Ensure production build succeeds

        npm run build

        '
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  test-etl:
    if: ${{ inputs.verification_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'cd etl

        python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-cov

        '
    - name: Run ETL Tests (REQUIRED)
      run: "cd etl\n# Run tests; exit code 5 = no tests collected, which is OK\nset +e\npython -m pytest\
        \ --cov=. --cov-report=xml --verbose --maxfail=1\nrc=$?\nset -e\nif [ $rc -eq 5 ]; then\n  echo\
        \ 'No tests collected, skipping'\n  exit 0\nfi\nexit $rc\n"
  security-scan:
    if: ${{ inputs.verification_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - name: Install Trivy
      run: 'sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee
        /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb
        $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update

        sudo apt-get install -y trivy

        '
    - name: Run Trivy vulnerability scanner
      run: "trivy fs --format sarif --output trivy-results.sarif \\\n  --severity CRITICAL,HIGH --exit-code\
        \ 0 .\n"
    - name: Upload Trivy results to GitHub Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
  test-browser:
    if: ${{ inputs.verification_scope == 'full' }}
    name: Browser publication acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install fixture API and browser dependencies
      run: 'pip install -r backend/requirements.txt PyYAML==6.0.2

        cd frontend

        npm ci

        npx playwright install --with-deps chromium

        '
    - name: Exercise published, absent, partial and refreshed data in Chromium
      working-directory: frontend
      run: npx playwright test --config playwright.acceptance.config.ts
    - name: Preserve browser failure receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-publication-acceptance
        path: 'frontend/acceptance-report/

          frontend/acceptance-results/

          '
        retention-days: 14
  test-browser-legacy:
    if: ${{ inputs.verification_scope == 'full' }}
    name: Original Chromium end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Verify frozen checkout
      run: python3 .github/scripts/verify_checkout.py
      env:
        VERIFICATION_COMMIT: ${{ inputs.commit_sha }}
        VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install isolated fixture API and Chromium
      run: 'pip install -r backend/requirements.txt

        cd frontend

        npm ci

        npx playwright install --with-deps chromium

        '
    - name: Run original cases against built Next.js and synthetic API
      working-directory: frontend
      run: npm run test:e2e:legacy
    - name: Preserve original suite receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-original-chromium
        path: 'frontend/legacy-report/

          frontend/legacy-results/

          '
        retention-days: 14
  quality-gate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
    - test-backend
    - test-frontend
    - test-browser
    - test-browser-legacy
    - test-etl
    - security-scan
    if: ${{ always() && inputs.verification_scope == 'full' }}
    steps:
    - name: Check All Tests Passed
      run: "echo \"Backend Tests: ${{ needs.test-backend.result }}\"\necho \"Frontend Tests: ${{ needs.test-frontend.result\
        \ }}\"\necho \"Browser Tests: ${{ needs.test-browser.result }}\"\necho \"Original Browser Tests:\
        \ ${{ needs.test-browser-legacy.result }}\"\necho \"ETL Tests: ${{ needs.test-etl.result }}\"\n\
        echo \"Security Scan: ${{ needs.security-scan.result }}\"\n\n# Backend + Frontend + Browser +\
        \ ETL must pass; security scan is advisory\nif [[ \"${{ needs.test-backend.result }}\" != \"success\"\
        \ ]] || \\\n   [[ \"${{ needs.test-frontend.result }}\" != \"success\" ]] || \\\n   [[ \"${{ needs.test-browser.result\
        \ }}\" != \"success\" ]] || \\\n   [[ \"${{ needs.test-browser-legacy.result }}\" != \"success\"\
        \ ]] || \\\n   [[ \"${{ needs.test-etl.result }}\" != \"success\" ]]; then\n  echo \"\u274C Quality\
        \ Gate FAILED - One or more test suites failed\"\n  exit 1\nfi\n\nif [[ \"${{ needs.security-scan.result\
        \ }}\" != \"success\" ]]; then\n  echo \"\u26A0\uFE0F Security scan failed (non-blocking) \u2014\
        \ check the Security tab for details\"\nfi\n\necho \"\u2705 Quality Gate PASSED - All tests successful\"\
        \n"
