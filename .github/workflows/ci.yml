name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  # Trivy's upload-sarif step uploads results here.
  security-events: write
  # upload-sarif@v4 calls the workflow-runs API under the hood to
  # fingerprint SARIF entries (so re-runs don't create duplicate
  # alerts). Without actions:read it logs "Resource not accessible by
  # integration" and the step exits non-zero, which fails the
  # security-scan job and blocks the quality-gate.
  actions: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: public.ecr.aws/docker/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8 (Critical Errors Only)
        run: |
          cd backend
          # Fail on critical errors (syntax errors, undefined names, etc.)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git

      - name: Prepare pinned owned PostgreSQL test images
        timeout-minutes: 5
        run: python .github/scripts/prepare_postgres_test_images.py --service-postgres-ref public.ecr.aws/docker/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3

      - name: Run Core Backend Tests (REQUIRED)
        id: backend_tests
        run: python .github/scripts/run_backend_tests.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audit_app_test
          REDIS_URL: redis://localhost:6379
          TESTING: true
          PYTHON_DOTENV_DISABLED: '1'

      - name: Report Local Backend Coverage
        id: local_coverage
        continue-on-error: true
        run: |
          cd backend
          if [ -f coverage.xml ]; then
            COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('coverage.xml').getroot(); print(float(root.attrib['line-rate']) * 100)")
            echo "Test Coverage: ${COVERAGE}%"
          else
            echo "⚠️ No coverage.xml found, skipping check"
          fi

      - name: Test workflow boundaries and optional coverage reporting
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Prepare optional Codecov upload
        id: coverage_upload_prepare
        continue-on-error: true
        run: python .github/scripts/coverage_upload.py prepare
        env:
          CODECOV_UPLOAD_ENABLED: ${{ vars.CODECOV_UPLOAD_ENABLED }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Attempt optional Codecov upload (hosted report unverified)
        id: coverage_upload
        if: steps.coverage_upload_prepare.outputs.status == 'ready'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report optional hosted coverage outcome
        if: always()
        run: python .github/scripts/coverage_upload.py report
        env:
          UPLOAD_STATUS: ${{ steps.coverage_upload_prepare.outputs.status }}
          # outcome preserves failure before continue-on-error rewrites conclusion.
          UPLOAD_OUTCOME: ${{ steps.coverage_upload.outcome }}
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.backend_tests.outcome }}
          LOCAL_COVERAGE_OUTCOME: ${{ steps.local_coverage.outcome }}

      - name: Validate API Health Check
        run: |
          cd backend
          # Quick smoke test - ensure main app can import
          python -c "from main import app; print('✅ App imports successfully')"

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (REQUIRED - No Warnings)
        run: |
          cd frontend
          # Fail if there are any linting errors or warnings
          npm run lint -- --max-warnings=0

      - name: Type Check (REQUIRED)
        run: |
          cd frontend
          # Ensure TypeScript compilation succeeds
          npx tsc --noEmit

      - name: Run Unit Tests (REQUIRED)
        run: |
          cd frontend
          # Run Jest/Vitest unit tests
          npm test -- --ci --coverage --passWithNoTests

      - name: Verify production dependency boundary
        run: |
          cd frontend
          npm run test:dependency-boundaries

      - name: Build (REQUIRED)
        run: |
          cd frontend
          # Ensure production build succeeds
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-only-anon-key

  test-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd etl
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run ETL Tests (REQUIRED)
        run: |
          cd etl
          # Run tests; exit code 5 = no tests collected, which is OK
          set +e
          python -m pytest --cov=. --cov-report=xml --verbose --maxfail=1
          rc=$?
          set -e
          if [ $rc -eq 5 ]; then
            echo 'No tests collected, skipping'
            exit 0
          fi
          exit $rc

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH --exit-code 0 .

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  test-browser:
    name: Browser publication acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install fixture API and browser dependencies
        run: |
          pip install -r backend/requirements.txt PyYAML==6.0.2
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise published, absent, partial and refreshed data in Chromium
        working-directory: frontend
        run: npx playwright test --config playwright.acceptance.config.ts
      - name: Preserve browser failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-publication-acceptance
          path: |
            frontend/acceptance-report/
            frontend/acceptance-results/
          retention-days: 14

  test-browser-legacy:
    name: Original Chromium end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated fixture API and Chromium
        run: |
          pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run original cases against built Next.js and synthetic API
        working-directory: frontend
        run: npm run test:e2e:legacy
      - name: Preserve original suite receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-original-chromium
          path: |
            frontend/legacy-report/
            frontend/legacy-results/
          retention-days: 14

  # Quality Gate - All tests must pass before deployment
  quality-gate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-browser, test-browser-legacy, test-etl, security-scan]
    if: always()

    steps:
      - name: Check All Tests Passed
        run: |
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Browser Tests: ${{ needs.test-browser.result }}"
          echo "Original Browser Tests: ${{ needs.test-browser-legacy.result }}"
          echo "ETL Tests: ${{ needs.test-etl.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

          # Backend + Frontend + Browser + ETL must pass; security scan is advisory
          if [[ "${{ needs.test-backend.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.test-browser.result }}" != "success" ]] || \
             [[ "${{ needs.test-browser-legacy.result }}" != "success" ]] || \
             [[ "${{ needs.test-etl.result }}" != "success" ]]; then
            echo "❌ Quality Gate FAILED - One or more test suites failed"
            exit 1
          fi

          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "⚠️ Security scan failed (non-blocking) — check the Security tab for details"
          fi

          echo "✅ Quality Gate PASSED - All tests successful"

  # ── Database Migrations ─────────────────────────────────────────────
  # Runs Alembic migrations against the real database AFTER tests pass
  # but BEFORE deployment, so the schema is always in sync with code.
  # Only runs on pushes to main/develop (not on PRs).
  run-migrations:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install migration dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          # Take the SQLAlchemy spec from requirements.txt: an unpinned install
          # pulled 2.1, which needs psycopg v3 for postgresql:// URLs (issue #228).
          pip install alembic psycopg2-binary "$(grep -iE '^sqlalchemy' requirements.txt)"

      - name: Run Alembic migrations
        run: |
          cd backend
          # Debug: verify the DATABASE_URL points to the pooler (not direct)
          python3 -c "
          import os
          url = os.environ.get('DATABASE_URL', '')
          if 'pooler.supabase.com' in url:
              print('✅ Using Supabase connection pooler (IPv4)')
          elif 'db.' in url and 'supabase.co' in url:
              print('❌ ERROR: DATABASE_URL points to direct connection (IPv6). Use the pooler URL instead.')
              print('   Expected host: aws-*-*.pooler.supabase.com:6543')
              exit(1)
          elif not url:
              print('❌ ERROR: DATABASE_URL is empty. Set the DATABASE_POOLER_URL secret.')
              exit(1)
          else:
              print(f'⚠️  Unknown host format — attempting connection anyway')
          "
          echo "Running database migrations..."
          alembic upgrade head
          echo "✅ Migrations applied successfully"
        env:
          # Use the Supabase connection POOLER URL (IPv4, port 6543) for CI.
          # The direct connection (port 5432) resolves to IPv6 which GitHub
          # Actions runners cannot reach.
          # Set this secret to: postgresql://postgres.[project-ref]:[password]@aws-1-ap-south-1.pooler.supabase.com:6543/postgres
          DATABASE_URL: ${{ secrets.DATABASE_POOLER_URL }}

  deploy-staging:
    needs: [quality-gate, run-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Staging
        run: |
          echo "✅ Quality gate passed - deploying to staging environment"
          # Add actual deployment steps here
          # Example: Deploy to Railway, Render, or AWS

  deploy-production:
    needs: [quality-gate, run-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-production-url.com

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Production
        run: |
          echo "✅ Quality gate passed - deploying to production environment"
          # Add actual deployment steps here
          # Example: Deploy to AWS ECS, Vercel, etc.
