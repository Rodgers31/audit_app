# Author delivery is deliberately inadmissible. No production identity is learned.
# Future activation must review/merge and pin BOTH dispatch workflow and tool source.
name: Manual ingestion read-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingestion-read-only-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Refuse dispatch outside accepted workflow identity
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DEFINITION_REF: ${{ github.workflow_ref }}
          # Nonsecret owner admission is provisioned AFTER the reviewed workflow
          # commit exists; no impossible self-referential commit pin. Unset now.
          APPROVED_DISPATCH_SHA: ${{ vars.INGESTION_PREFLIGHT_APPROVED_WORKFLOW_SHA }}
        run: |
          set -eu
          test "$DISPATCH_REPOSITORY" = Rodgers31/audit_app
          test "$DISPATCH_REF" = refs/heads/main
          test "$DEFINITION_REF" = Rodgers31/audit_app/.github/workflows/ingestion-preflight.yml@refs/heads/main
          test "${#APPROVED_DISPATCH_SHA}" -eq 40
          case "$APPROVED_DISPATCH_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$DISPATCH_SHA" = "$APPROVED_DISPATCH_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Reviewed implementation snapshot; activation remains blocked.
          ref: 739216efba9d5ed97ee3de8f39c277110ac1c3fa
          persist-credentials: false
          path: app
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Policy is an independently pinned later commit referring to app's
          # already-known immutable HEAD. Never checkout dispatch input/ref.
          ref: 739216efba9d5ed97ee3de8f39c277110ac1c3fa
          persist-credentials: false
          path: admission
      - name: Refuse missing accepted expectations before dependency or secret access
        run: |
          python -B app/scripts/verification/ingestion_preflight.py --admit-only \
            --reviewed-admission "$GITHUB_WORKSPACE/admission/docs/admin/batch66/preflight-admission.json" \
            --expected-admission-sha256 e291df96f321f9e8b9615daa56549aa80c322e0dd6accee29342fd602d761924
      - name: Install pinned inspection driver without database credentials
        run: |
          python -I -m pip --isolated install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r app/docs/admin/batch66/preflight-driver-requirements.txt
      - name: Inspect only the admitted pinned database
        timeout-minutes: 1
        env:
          INGESTION_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -B app/scripts/verification/ingestion_preflight.py --execute-read-only \
            --reviewed-admission "$GITHUB_WORKSPACE/admission/docs/admin/batch66/preflight-admission.json" \
            --expected-admission-sha256 e291df96f321f9e8b9615daa56549aa80c322e0dd6accee29342fd602d761924 \
            --out "$RUNNER_TEMP/ingestion-preflight.json"
      # No artifact upload. Only fixed diagnostics and a bounded sanitized report.
