name: Database Seeding & Data Refresh

on:
  # ── Scheduled runs ─────────────────────────────────────────────────
  # Monday–Saturday full refresh at 02 UTC; Sunday runs once at 03 UTC
  # Weekly deep refresh (bootstrap + all domains) on Sundays at 3 AM UTC
  schedule:
    - cron: '0 2 * * 1-6'
    - cron: '0 3 * * 0'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      domain:
        description: 'One supported native domain (all keeps the legacy scope plus explicit opt-ins)'
        required: false
        type: choice
        default: all
        options:
          - all
          - audits
          - counties_budget
          - economic_indicators
          - population
          - county_officials
          - national_debt
          - national_budget
          - pending_bills
          - debt_timeline
          - fiscal_summary
          - revenue_by_source
          - learning_hub
          - stalled_projects
          - national_gdp
          - imf_weo
          - cra
          - opendata
          - county_borrowing
      dry_run:
        description: 'Native preview (operational jobs/receipts may write; no schema migration)'
        required: false
        type: boolean
        default: false
      run_bootstrap:
        description: 'Also run bootstrap seeding (county data + national data)'
        required: false
        type: boolean
        default: false
      reacquire_pending_pdf:
        description: 'Fresh PDF acquisition for only pending_bills (normal nightly cache unchanged)'
        required: false
        type: boolean
        default: false
      audits_review:
        description: 'One-time source-checked OAG repair (none for ordinary refresh)'
        required: false
        type: choice
        default: none
        options:
          - none
          - oag-2542-20261026
      audits_source_acceptance:
        description: 'Bounded fresh acquisition of four reviewed OAG county volumes (manual audits only)'
        required: false
        type: choice
        default: none
        options:
          - none
          - oag-combined-catalogue-20261101
      run_validation:
        description: 'Run data validation after seeding'
        required: false
        type: boolean
        default: true

# ── One seeder at a time, against one database ─────────────────────
# Every run of this workflow writes the SAME production database, whichever
# ref it was launched from, so the group is a constant rather than keyed on
# github.ref or github.workflow. A scheduled run on main and a manual dispatch
# from a branch must not overlap either.
#
# 2026-09-07: two workflow_dispatch runs started 60 seconds apart and both
# reached "Seed all domains". They happened to be compatible; the register
# writer is not. `reconcile_external_creditors` deletes every external loan the
# incoming run does not name and then upserts its own, so two interleaved runs
# can delete each other's rows and commit a partial register — the half-written
# state the fail-closed check in `fetch_debt_payload` exists to prevent.
#
# cancel-in-progress is FALSE deliberately. Cancelling the in-flight run is the
# usual choice for CI, where the newest commit is the only interesting one, and
# the wrong one here: the running job is mid-transaction against production and
# the queued one loses nothing by waiting. GitHub keeps one pending run per
# group and drops the rest while they are still pending, so this cannot back up.
concurrency:
  group: seed-production-database
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PYTHON_DOTENV_DISABLED: '1'
  # Keep installed artifact identities stable across ordinary Python children.
  PYTHONDONTWRITEBYTECODE: '1'
  # Shared seeding configuration
  SEED_RATE_LIMIT: ${{ vars.SEED_RATE_LIMIT || '60/min' }}
  SEED_TIMEOUT_SECONDS: ${{ vars.SEED_TIMEOUT_SECONDS || '30.0' }}
  # Global wall-clock budget for `seed --all` (seconds). Kept below the
  # "Seed planned domains" step timeout (45 min) and seed job timeout (50 min).
  # #836's measured daily envelope is ~33 min; allow 40 min of processing and
  # separate cleanup/setup headroom. Recalibrate all three limits together,
  # including any repository-variable override. Per-source caps stay at 600s.
  SEED_TOTAL_TIMEOUT_SECONDS: ${{ vars.SEED_TOTAL_TIMEOUT_SECONDS || '2400' }}
  # CoB's indexed scan leaves parse reserve within its unchanged 600s domain
  # cap. Other PDF sources keep their own transfer limits.
  SEED_COB_PDF_DOWNLOAD_TIMEOUT_SECONDS: '420'
  # OCR for scanned OAG audit-report PDFs requires the admitted native runtime.
  # Opt out with SEED_AUDITS_OCR_ENABLED=false.
  SEED_AUDITS_OCR_ENABLED: ${{ vars.SEED_AUDITS_OCR_ENABLED || 'true' }}
  SEED_AUDITS_OCR_MAX_PAGES: ${{ vars.SEED_AUDITS_OCR_MAX_PAGES || '30' }}
  # Source-qualified executive aging remains opt-in until bounded rollout.
  SEED_PENDING_BILLS_AGING_ENABLED: ${{ vars.SEED_PENDING_BILLS_AGING_ENABLED || 'false' }}
  SEED_PENDING_BILLS_ASSEMBLY_AGING_ENABLED: ${{ vars.SEED_PENDING_BILLS_ASSEMBLY_AGING_ENABLED || 'false' }}
  # Listing pages used to DISCOVER the current edition of each periodically
  # republished document, so a new release is ingested automatically instead
  # of the pipeline re-reading a hardcoded path forever.
  SEED_CBK_STATISTICAL_BULLETIN_PAGE_URL: ${{ vars.SEED_CBK_STATISTICAL_BULLETIN_PAGE_URL || 'https://www.centralbank.go.ke/releases/statistical-bulletin/' }}
  SEED_TREASURY_BROP_PAGE_URL: ${{ vars.SEED_TREASURY_BROP_PAGE_URL || 'https://www.treasury.go.ke/budget-review-and-outlook-paper/' }}
  # Default-off source rollout. No variable is enabled by this workflow change.
  SEED_CRA_INGESTION_ENABLED: ${{ vars.SEED_CRA_INGESTION_ENABLED || 'false' }}
  SEED_OPENDATA_INGESTION_ENABLED: ${{ vars.SEED_OPENDATA_INGESTION_ENABLED || 'false' }}
  SEED_KNBS_RELEASE_DISCOVERY_ENABLED: ${{ vars.SEED_KNBS_RELEASE_DISCOVERY_ENABLED || 'false' }}
  SEED_COUNTY_BORROWING_INGESTION_ENABLED: ${{ vars.SEED_COUNTY_BORROWING_INGESTION_ENABLED || 'false' }}
  SEED_NATIVE_FINANCIAL_SOURCE_ADMISSION_ENABLED: ${{ vars.SEED_NATIVE_FINANCIAL_SOURCE_ADMISSION_ENABLED || 'false' }}
  SEED_PLAN_EVENT: ${{ github.event_name }}
  SEED_PLAN_SCHEDULE: ${{ github.event.schedule }}
  SEED_PLAN_DOMAIN: ${{ github.event.inputs.domain }}
  SEED_PLAN_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  SEED_PLAN_BOOTSTRAP: ${{ github.event.inputs.run_bootstrap || 'false' }}
  SEED_PLAN_AUDITS_REVIEW: ${{ github.event.inputs.audits_review != 'none' && github.event.inputs.audits_review || '' }}
  SEED_PLAN_AUDITS_SOURCE_ACCEPTANCE: ${{ github.event.inputs.audits_source_acceptance != 'none' && github.event.inputs.audits_source_acceptance || '' }}
  SEED_PLAN_REACQUIRE_PENDING_BILLS_PDF: ${{ github.event.inputs.reacquire_pending_pdf || 'false' }}
  SEED_LOG_LEVEL: INFO
  SOCIAL_GENERATION_HOOK_ENABLED: ${{ vars.SOCIAL_GENERATION_HOOK_ENABLED || 'false' }}
  SOCIAL_REPORT_GENERATION_ENABLED: ${{ vars.SOCIAL_REPORT_GENERATION_ENABLED || 'false' }}
  # Separate financial admission/draft ceiling; never enables publishing or workers.
  SOCIAL_NATIVE_FINANCIAL_GENERATION_ENABLED: ${{ vars.SOCIAL_NATIVE_FINANCIAL_GENERATION_ENABLED || 'false' }}

jobs:
  source_plan:
    name: Validate source selection before any writer
    if: github.event_name != 'schedule' || vars.INGESTION_NIGHTLY_ENABLED == 'true'
    outputs:
      domains: ${{ steps.plan.outputs.domains }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - &source-plan-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
      - &source-plan-runtime
        name: Install reviewed ingestion runtime
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_PATH:?}"
          if [ "$RUNNER_TEMP" != "$(cd -- "$RUNNER_TEMP" && pwd -P)" ]; then
            echo '::error::Expected an existing, canonical runner temp directory.'
            exit 1
          fi
          # acquire/install require fresh destinations inside an existing private parent.
          INGESTION_SCRATCH="$(mktemp -d -- "$RUNNER_TEMP/ingestion-source-plan.XXXXXXXX")"
          python -B tools/nightly_acceptance_20261105/runtime.py acquire --wheelhouse "$INGESTION_SCRATCH/wheels"
          python -B tools/nightly_acceptance_20261105/runtime.py wheels --wheelhouse "$INGESTION_SCRATCH/wheels"
          python -B tools/nightly_acceptance_20261105/runtime.py install --wheelhouse "$INGESTION_SCRATCH/wheels" --venv "$INGESTION_SCRATCH/runtime"
          "$INGESTION_SCRATCH/runtime/bin/python" -B tools/nightly_acceptance_20261105/runtime.py verify
          printf '%s\n' "$INGESTION_SCRATCH/runtime/bin" >> "$GITHUB_PATH"
      - name: Validate whitelisted plan
        id: plan
        env:
          SEED_BUDGETS_DATASET_URL: ${{ secrets.SEED_BUDGETS_DATASET_URL }}
          SEED_AUDITS_DATASET_URL: ${{ secrets.SEED_AUDITS_DATASET_URL }}
          SEED_POPULATION_DATASET_URL: ${{ secrets.SEED_POPULATION_DATASET_URL }}
          SEED_ECONOMIC_INDICATORS_DATASET_URL: ${{ secrets.SEED_ECONOMIC_INDICATORS_DATASET_URL }}
          SEED_KRA_REVENUE_URL: ${{ secrets.SEED_KRA_REVENUE_URL || vars.SEED_KRA_REVENUE_URL }}
        run: |
          cd backend
          python -m seeding.source_plan --check
          python -m seeding.current_run

  # ══════════════════════════════════════════════════════════════════
  # Step 0: Health-check all government data source URLs
  # Catches broken/migrated URLs BEFORE seeding starts so failures
  # are surfaced immediately instead of buried in log warnings.
  # ══════════════════════════════════════════════════════════════════
  healthcheck:
    needs: [source_plan]
    name: Data Source Health Check
    if: github.event_name != 'schedule' || vars.INGESTION_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Allow time for the reviewed runtime plus the existing 240s probe budget.
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      report: ${{ steps.check.outputs.report }}
      has_failures: ${{ steps.check.outputs.has_failures }}
      unprobed: ${{ steps.check.outputs.unprobed }}
      critical_reachable: ${{ steps.check.outputs.critical_reachable }}
      inventory_sha256: ${{ steps.check.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - *source-plan-python
      - *source-plan-runtime
      - name: Prepare selected health inventory locally
        id: inventory
        env:
          HC_PLAN_SHA: ${{ needs.source_plan.outputs.plan_sha256 }}
          HC_SOURCE_SHA: ${{ needs.source_plan.outputs.source_sha }}
          SEED_BUDGETS_DATASET_URL: ${{ secrets.SEED_BUDGETS_DATASET_URL }}
          SEED_AUDITS_DATASET_URL: ${{ secrets.SEED_AUDITS_DATASET_URL }}
          SEED_POPULATION_DATASET_URL: ${{ secrets.SEED_POPULATION_DATASET_URL }}
          SEED_ECONOMIC_INDICATORS_DATASET_URL: ${{ secrets.SEED_ECONOMIC_INDICATORS_DATASET_URL }}
          SEED_KRA_REVENUE_URL: ${{ secrets.SEED_KRA_REVENUE_URL || vars.SEED_KRA_REVENUE_URL }}
        run: |
          cd backend
          python -B -m seeding.health_inventory
      - name: Check data source URLs
        id: check
        run: |
          #!/usr/bin/env bash
          # Actions runs this step with `bash -eo pipefail`, so every command
          # that may fail is guarded. Measured outages use outputs; malformed
          # inventories/budgets refuse with a nonzero status. Neither authorizes seeding.

          # This inventory is produced by the selected native plan/settings.
          # No probe, including an edition probe, certifies financial acceptance.
          SOURCES=(
          )
          inventory_file="${RUNNER_TEMP:?}/seed-health-inventory"
          [ -f "$inventory_file" ] && [ ! -L "$inventory_file" ] && [ -O "$inventory_file" ] ||
            { echo 'Selected source-health inventory missing or unsafe' >&2; exit 2; }
          HC_SOURCE_INVENTORY=$(cat "$inventory_file")
          rm -- "$inventory_file"
          if [ -z "${HC_SOURCE_INVENTORY:-}" ] || [ "${#HC_SOURCE_INVENTORY}" -gt 24000 ]; then
            echo 'Selected source-health inventory missing or exceeds bound' >&2
            exit 2
          fi
          while IFS= read -r entry; do
            [ -n "$entry" ] || { echo 'Empty health source refused' >&2; exit 2; }
            for existing_entry in "${SOURCES[@]}"; do
              if [ "$existing_entry" = "$entry" ]; then
                echo 'Duplicate health source refused' >&2; exit 2
              fi
            done
            SOURCES+=("$entry")
          done <<< "$HC_SOURCE_INVENTORY"
          unset HC_SOURCE_INVENTORY
          if [ "${#SOURCES[@]}" -gt 128 ]; then exit 2; fi
          HC_TMP=$(mktemp -d)
          trap 'rm -rf -- "$HC_TMP"' EXIT
          HC_BODY_FILE="$HC_TMP/body"

          REPORT=""
          FAILED_CRITICAL=0
          FAILED_WARN=0
          TOTAL=${#SOURCES[@]}
          OK_COUNT=0
          NOT_PROBED=0
          CRITICAL_TOTAL=0
          CRITICAL_OK=0

          # ── Time budgets (seconds) ────────────────────────────────
          # The job has a hard timeout, and a killed job
          # writes NO outputs. Run 36211613362 (2026-09-26): five [OK] lines,
          # then OAG WP REST API went silent for 293s and the job was
          # cancelled. The old probe was `curl --max-time 60 --retry 2
          # --retry-delay 3`, and curl retries a --max-time timeout, so one
          # call could last 3×60+2×3 = 186s; a timeout is "000", which is
          # transient, so the browser-UA re-probe added another 186s — 372s
          # for ONE source, longer than the whole job. Every wait is now drawn
          # from two deadlines:
          #   HC_SOURCE_BUDGET  all attempts, both UAs, for one source
          #   HC_JOB_BUDGET     all sources; whatever is left when it runs out
          #                     is reported "not probed", and the outputs are
          #                     still written before the job cap.
          # Env-overridable so backend/tests/test_healthcheck_is_bounded.py
          # can run this script against a host that never answers.
          HC_ATTEMPT_MAX_TIME=${HC_ATTEMPT_MAX_TIME:-60}
          HC_SOURCE_BUDGET=${HC_SOURCE_BUDGET:-75}
          HC_JOB_BUDGET=${HC_JOB_BUDGET:-240}
          HC_RETRY_DELAY=${HC_RETRY_DELAY:-3}
          for bound in HC_ATTEMPT_MAX_TIME HC_SOURCE_BUDGET HC_JOB_BUDGET HC_RETRY_DELAY; do
            value=${!bound}
            if ! [[ "$value" =~ ^(0|[1-9][0-9]{0,2})$ ]]; then
              echo "Malformed health budget: $bound" >&2; exit 2
            fi
          done
          if [ "$HC_ATTEMPT_MAX_TIME" -lt 1 ] || [ "$HC_ATTEMPT_MAX_TIME" -gt 60 ] ||
             [ "$HC_SOURCE_BUDGET" -lt 1 ] || [ "$HC_SOURCE_BUDGET" -gt 75 ] ||
             [ "$HC_JOB_BUDGET" -lt 1 ] || [ "$HC_JOB_BUDGET" -gt 240 ] ||
             [ "$HC_RETRY_DELAY" -gt 10 ]; then
            echo 'Health budget exceeds approved bounds' >&2; exit 2
          fi
          JOB_DEADLINE=$(( SECONDS + HC_JOB_BUDGET ))

          # Primary UA must start with a known HTTP-client identifier
          # (python-httpx / python-requests / curl) so the IMF DataMapper
          # API doesn't 403 us — it filters non-canonical UAs. We append
          # our own identifier + a contact URL for site operators.
          PRIMARY_UA="python-httpx/0.27 KenyaAuditApp-HealthCheck/1.0 (+https://github.com/Rodgers31/audit_app)"
          # Some government WAFs (COB, OAG) intermittently bot-block that UA
          # from datacenter IPs with 403/415/429; a browser UA sometimes
          # gets through, so we re-probe blocked sources with it.
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # $1 = User-Agent, $2 = URL, $3 = seconds allowed. ONE attempt,
          # following redirects. Prints "<3-digit code> <curl exit status>".
          # No curl --retry: curl retries a --max-time timeout, which is how
          # one probe outlived the job. Retries are made by probe_source,
          # which charges each one against the deadline.
          #
          # curl writes the code via -w; on a connection failure it prints
          # "000" AND exits non-zero. The old `... || echo "000"` appended a
          # SECOND "000" → "000000", which no longer matches is_transient
          # ("000" exactly) and wrongly escalated genuine outages to the
          # critical branch (see Treasury "000000" in issue #124). Capture
          # stdout, keep the assignment from tripping `set -e` on curl's
          # non-zero exit, then normalise anything that isn't a bare 3-digit
          # code to "000".
          #
          # Exit 28 is "operation timed out". A host that sends "200" headers
          # and then stalls the body ALSO exits 28 — with code 200 — so the
          # code alone would call a timeout healthy. Exit 28 forces "000".
          probe_once() {
            local code rc=0
            local range_args=()
            # A bounded prefix establishes transport only, never full edition
            # acceptance. Large reviewed PDFs must not require full downloads.
            case "$2" in *.pdf|*.PDF|*.xlsx) range_args=(--range 0-65535) ;; esac
            code=$(curl -s -o "$HC_BODY_FILE" -w "%{http_code}" \
              --max-filesize 8388608 "${range_args[@]}" --proto =https,http --proto-redir =https \
              -L --max-time "$3" \
              -A "$1" "$2" 2>/dev/null) || rc=$?
            [[ "$code" =~ ^[0-9]{3}$ ]] || code="000"
            if [ "$rc" != "0" ]; then code="000"; fi
            printf '%s %s' "$code" "$rc"
          }

          # Retry plausible temporary failures within the existing budgets.
          # Exhaustion is actionable for a critical source in THIS run: it
          # must not remain a warning forever or qualify as recovery (#294).
          is_transient() { [[ "$1" =~ ^(403|415|429|000)$ || "$1" =~ ^5[0-9][0-9]$ ]]; }
          # What the old `curl --retry` retried: timeouts/resets, 408, 429, 5xx.
          # A 403/415 block is not retried with the same UA — it goes straight
          # to the browser UA below.
          is_retryable() { [[ "$1" =~ ^(000|408|429)$ || "$1" =~ ^5[0-9][0-9]$ ]]; }

          # $1 = URL. Sets HTTP_CODE and the transport outcome of the latest
          # completed probe. Up to 3 attempts per UA; returns by the
          # earlier of its own deadline and the job's, whatever the host does.
          #
          # On a transient code, re-probe with the browser UA before
          # concluding the source is unhealthy. Adopt the browser code
          # whenever it is DEFINITIVE (i.e. not itself transient): a success
          # (2xx/3xx) means the source is reachable and the block was just our
          # UA, while a genuine 4xx-gone (404/410) revealed past the WAF means
          # the URL migrated and must still surface via the critical-flag
          # branch — not be masked behind the original transient code. Report
          # the last attempted transport outcome if both UAs fail.
          probe_source() {
            local url=$1 deadline ua attempt left out code rc
            deadline=$(( SECONDS + HC_SOURCE_BUDGET ))
            if [ "$deadline" -gt "$JOB_DEADLINE" ]; then deadline=$JOB_DEADLINE; fi
            HTTP_CODE="000"
            TIMED_OUT=0
            PROBE_ERROR=""
            for ua in "$PRIMARY_UA" "$BROWSER_UA"; do
              for attempt in 1 2 3; do
                left=$(( deadline - SECONDS ))
                if [ "$left" -lt 1 ]; then return 0; fi
                if [ "$left" -gt "$HC_ATTEMPT_MAX_TIME" ]; then left=$HC_ATTEMPT_MAX_TIME; fi
                out=$(probe_once "$ua" "$url" "$left")
                code=${out% *}
                rc=${out#* }
                HTTP_CODE=$code
                TIMED_OUT=0
                PROBE_ERROR=""
                case "$rc" in
                  0) ;;
                  7) PROBE_ERROR="connection refused" ;;
                  18) PROBE_ERROR="incomplete response" ;;
                  28) PROBE_ERROR="timeout"; TIMED_OUT=1 ;;
                  51|60) PROBE_ERROR="TLS certificate verification failed"; return 0 ;;
                  63) PROBE_ERROR="bounded body probe refused or exceeds byte limit"; return 0 ;;
                  *) PROBE_ERROR="transport error $rc" ;;
                esac
                if [ "$ua" = "$BROWSER_UA" ] && ! is_transient "$code"; then
                  return 0
                fi
                if ! is_retryable "$code"; then break; fi
                # No wait after the last attempt: it only delayed the next UA
                # (or source), so a fast failure (refused, DNS) cost 18s and a
                # runner-wide DNS outage overran the job budget.
                if [ "$attempt" -ge 3 ]; then break; fi
                if [ $(( deadline - SECONDS )) -le "$HC_RETRY_DELAY" ]; then return 0; fi
                sleep "$HC_RETRY_DELAY"
              done
              if ! is_transient "$HTTP_CODE"; then return 0; fi
            done
          }

          source_index=0
          label_pattern='^[a-zA-Z0-9_ .:/-]+$'
          while [ "$source_index" -lt "${#SOURCES[@]}" ]; do
            entry=${SOURCES[$source_index]}
            source_index=$((source_index + 1))
            IFS='|' read -r label url critical discovery extra <<< "$entry"
            if ! [[ "$label" =~ $label_pattern ]] || [ "${#label}" -gt 512 ] || [ -n "$extra" ] ||
               ! [[ "$critical" =~ ^(true|false)$ ]] ||
               ! [[ "${discovery:-none}" =~ ^(none|treasury_editions)$ ]]; then
              echo 'Malformed selected health source' >&2; exit 2
            fi
            if [ "$url" = reference ] && [ "$critical" = false ] &&
               [ "$label" = 'learning_hub curated learning reference' ]; then
              REPORT="${REPORT}OK|${label}|curated reference; no live publisher expected\n"
              OK_COUNT=$((OK_COUNT + 1))
              continue
            fi
            if [ "$url" = missing ]; then
              REPORT="${REPORT}CRITICAL|${label}|required diagnostic coverage unavailable\n"
              FAILED_CRITICAL=$((FAILED_CRITICAL + 1))
              CRITICAL_TOTAL=$((CRITICAL_TOTAL + 1))
              continue
            fi
            if ! [[ "$url" =~ ^https?://[^[:space:]\|]+$ ]]; then
              echo 'Invalid health source URL' >&2; exit 2
            fi
            if [ "$critical" = "true" ]; then CRITICAL_TOTAL=$((CRITICAL_TOTAL + 1)); fi

            # Out of job budget: say so for every source still waiting,
            # rather than let the runner kill the job and drop the outputs.
            if [ $(( JOB_DEADLINE - SECONDS )) -lt 1 ]; then
              echo "  [WARNING] $label → not probed: the ${HC_JOB_BUDGET}s health-check budget ran out"
              severity=WARNING
              if [ "$critical" = true ]; then severity=CRITICAL; fi
              REPORT="${REPORT}${severity}|${label}|not probed - coverage unknown\n"
              NOT_PROBED=$((NOT_PROBED + 1))
              if [ "$critical" = true ]; then
                FAILED_CRITICAL=$((FAILED_CRITICAL + 1))
              else
                FAILED_WARN=$((FAILED_WARN + 1))
              fi
              continue
            fi

            started=$SECONDS
            : > "$HC_BODY_FILE"
            probe_source "$url"
            if [ "$discovery" = treasury_editions ]; then
              # Parse only the bounded fetched listing. Missing/ambiguous
              # discovery becomes an explicit required diagnostic gap.
              if [[ "$HTTP_CODE" =~ ^2 ]] && python3 - "$HC_BODY_FILE" "$url" > "$HC_TMP/editions" 2>/dev/null <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          import sys
          body = Path(sys.argv[1]).read_bytes()
          if not body or len(body) > 8 * 1024 * 1024:
              raise SystemExit(2)
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls = set()
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  for key, value in attrs:
                      if key != 'href' or not value: continue
                      url = urljoin(sys.argv[2], value)
                      low = unquote(url).lower()
                      parsed = urlsplit(url)
                      if ('budget' in low and 'summary' in low and parsed.path.lower().endswith('.pdf')
                              and not any(x in low for x in ('draft','supplementary','supp-'))):
                          if (parsed.scheme != 'https' or parsed.hostname not in
                                  ('www.treasury.go.ke','treasury.go.ke','oldsite.treasury.go.ke')
                                  or parsed.username or parsed.password or parsed.fragment
                                  or len(url) > 2048 or any(c.isspace() or c == '|' for c in url)):
                              raise ValueError('Unqualified Treasury edition link')
                          self.urls.add(url)
          links = Links(); links.feed(body.decode('utf-8', errors='strict'))
          if not 1 <= len(links.urls) <= 24: raise SystemExit(2)
          for index, url in enumerate(sorted(links.urls), 1):
              print(f'fiscal_summary framework edition {index}|{url}|true')
          PY
              then
                while IFS= read -r edition; do SOURCES+=("$edition"); done < "$HC_TMP/editions"
              else
                SOURCES+=("fiscal_summary edition discovery|missing|true")
              fi
              if [ "${#SOURCES[@]}" -gt 152 ]; then echo 'Edition inventory exceeds bound' >&2; exit 2; fi
              TOTAL=${#SOURCES[@]}
            fi

            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              echo "  [OK]   $label ($HTTP_CODE)"
              REPORT="${REPORT}OK|${label}|${HTTP_CODE}\n"
              OK_COUNT=$((OK_COUNT + 1))
              if [ "$critical" = "true" ]; then CRITICAL_OK=$((CRITICAL_OK + 1)); fi
            else
              severity="WARNING"
              if [ "$critical" = "true" ]; then
                severity="CRITICAL"
                FAILED_CRITICAL=$((FAILED_CRITICAL + 1))
              else
                FAILED_WARN=$((FAILED_WARN + 1))
              fi
              outcome=${PROBE_ERROR:-$HTTP_CODE}
              if [ "$TIMED_OUT" = "1" ]; then
                echo "  [${severity}] $label → timed out after $((SECONDS - started))s"
              else
                echo "  [${severity}] $label → HTTP $HTTP_CODE ($outcome)"
              fi
              REPORT="${REPORT}${severity}|${label}|${outcome}\n"
            fi
          done

          echo ""
          echo "─── Health Check Summary ───"
          echo "Total: $TOTAL | OK: $OK_COUNT | Critical Failures: $FAILED_CRITICAL | Warnings: $FAILED_WARN | Not probed: $NOT_PROBED | Elapsed: ${SECONDS}s"

          # Write outputs for downstream jobs
          # Escape newlines for GitHub Actions output
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "report<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

          if [ "$FAILED_CRITICAL" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi
          # has_failures=false only means "no CRITICAL line". Sources the job
          # budget never reached have no verdict at all, so the notify job must
          # not read that as "all reachable" and auto-close open outage issues.
          echo "unprobed=$NOT_PROBED" >> "$GITHUB_OUTPUT"
          if [ "$CRITICAL_TOTAL" -gt 0 ] && [ "$CRITICAL_OK" = "$CRITICAL_TOTAL" ]; then
            echo "critical_reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical_reachable=false" >> "$GITHUB_OUTPUT"
          fi

          printf '%s\n' "${SOURCES[@]}" > "$HC_TMP/inventory"
          python3 - "$HC_TMP/inventory" >> "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sys
          print('inventory_sha256='+sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY

          # Write to step summary
          echo "Diagnostic scope: selected component reachability, including Treasury summary links. Runtime-discovered OAG/COB/PBB/KRA document and bundle URLs are not exhaustively probed here; inspect domain receipts. Reachability is not edition/content/coverage acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "## Data Source Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Source | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo -e "$REPORT" | while IFS='|' read -r status label code; do
            [ -z "$status" ] && continue
            if [ "$status" = "OK" ]; then
              echo "| ✅ OK | $label | $code |" >> $GITHUB_STEP_SUMMARY
            elif [ "$status" = "CRITICAL" ]; then
              echo "| ❌ CRITICAL | **$label** | $code |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ⚠️ WARNING | $label | $code |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OK:** $OK_COUNT / $TOTAL | **Critical:** $FAILED_CRITICAL | **Warnings:** $FAILED_WARN | **Not probed:** $NOT_PROBED" >> $GITHUB_STEP_SUMMARY

          # Log a warning annotation if critical sources are down
          if [ "$FAILED_CRITICAL" -gt 0 ]; then
            echo "::warning::$FAILED_CRITICAL critical data source(s) failed or have unknown coverage. Health diagnostics do not authorize seeding."
          fi

          # Always exit 0 — health check is informational only.
          # The notify job reads outputs to create GitHub issues.
          exit 0

  # ══════════════════════════════════════════════════════════════════
  # Step 1: Verify the already deployed database; never migrate on a timer.
  # ══════════════════════════════════════════════════════════════════
  migrate:
    needs: [source_plan]
    name: Verify Accepted Database
    outputs:
      source_sha: ${{ steps.schema.outputs.source_sha }}
      schema_head: ${{ steps.schema.outputs.schema_head }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_GITHUB_DATABASE_TLS: '1'
    steps:
      - name: Refuse writes outside the explicitly accepted source revision
        env:
          APPROVED_SHA: ${{ vars.INGESTION_WRITE_APPROVED_SHA }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_EVENT: ${{ github.event_name }}
          NIGHTLY_ENABLED: ${{ vars.INGESTION_NIGHTLY_ENABLED }}
        run: |
          set -eu
          test "$REPOSITORY" = Rodgers31/audit_app
          test "$DISPATCH_REF" = refs/heads/main
          test "${#APPROVED_SHA}" -eq 40
          case "$APPROVED_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$DISPATCH_SHA" = "$APPROVED_SHA"
          case "$DISPATCH_EVENT" in
            workflow_dispatch) ;;
            schedule) test "$NIGHTLY_ENABLED" = true ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record independent runner native diagnostics
        run: >-
          /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8
          GITHUB_JOB="$GITHUB_JOB" /usr/bin/python3 -B
          tools/nightly_acceptance_20261105/native_jobs.py runner-diagnostics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
          architecture: x64
          check-latest: false
      - name: Require hosted native writer admission
        env:
          APPROVED_SHA: ${{ vars.INGESTION_WRITE_APPROVED_SHA }}
          NIGHTLY_ENABLED: ${{ vars.INGESTION_NIGHTLY_ENABLED }}
        run: python -I -B tools/nightly_acceptance_20261105/hosted_parser.py
      - name: Prepare verified writer TLS without copying credentials
        run: python -I -B scripts/verification/github_database_qualify.py --prepare-writer-tls
      - name: Qualify the stored target and require the accepted schema head
        timeout-minutes: 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -I -B scripts/verification/github_database_qualify.py --seed
          cd backend
          test "$(alembic heads)" = 'a756b20a0001 (head)'

      # A migration that "succeeded" is not a schema that matches the models.
      # `alembic stamp --purge` ASSERTS equivalence to a baseline, it never
      # verifies it — which is how public.users sat with 6 of its 9 columns
      # while every nightly reported success, 500ing every authenticated
      # request with `column users.display_name does not exist`. The unit
      # tests cannot catch this either: they build their database with
      # create_all(), so it matches the models by construction.
      #
      # This is the only place the real deployed schema is ever compared to
      # what the ORM will select. It fails the job, which stops seed/validate
      # on `needs:` — correct: writing into a schema the code disagrees with
      # is worse than not writing.
      - name: Verify the deployed schema matches the models
        id: schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -c "
          import sys
          from database import engine
          from models import Base
          from services.schema_parity import check_database, format_report

          missing = check_database(engine, Base.metadata)
          print(format_report(missing))
          if missing:
              sys.exit(1)
          "
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo 'schema_head=a756b20a0001' >> "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════════════════════════════
  # Step 2: Bootstrap seeding (counties, national GDP, population, etc.)
  # Runs on manual trigger with run_bootstrap=true, or on Sunday schedule
  # ══════════════════════════════════════════════════════════════════
  bootstrap:
    name: Bootstrap Reference Data
    # AFTER seed, not beside it. Both write `audits`, and on `needs: migrate`
    # they started within a second of each other every Sunday — the collision
    # that ended run 34008714644 in a statement timeout. Bootstrap now also
    # defers at runtime when it sees a seed run in flight
    # (bootstrap._seed_run_in_flight), so ordering the jobs here is what keeps
    # the weekly refresh from deferring itself into a permanent no-op.
    needs: [migrate, seed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_GITHUB_DATABASE_TLS: '1'
    if: >-
      github.event.inputs.run_bootstrap == 'true' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record independent runner native diagnostics
        run: >-
          /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8
          GITHUB_JOB="$GITHUB_JOB" /usr/bin/python3 -B
          tools/nightly_acceptance_20261105/native_jobs.py runner-diagnostics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
          architecture: x64
          check-latest: false
      - name: Require hosted native writer admission
        env:
          APPROVED_SHA: ${{ vars.INGESTION_WRITE_APPROVED_SHA }}
          NIGHTLY_ENABLED: ${{ vars.INGESTION_NIGHTLY_ENABLED }}
        run: python -I -B tools/nightly_acceptance_20261105/hosted_parser.py
      - name: Prepare verified writer TLS without copying credentials
        run: python -I -B scripts/verification/github_database_qualify.py --prepare-writer-tls
      - name: Qualify this job's actual database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -I -B scripts/verification/github_database_qualify.py --seed
      - name: Run bootstrap seeding
        env:
          SEED_BUDGETS_DATASET_URL: ${{ secrets.SEED_BUDGETS_DATASET_URL }}
          SEED_AUDITS_DATASET_URL: ${{ secrets.SEED_AUDITS_DATASET_URL }}
          SEED_POPULATION_DATASET_URL: ${{ secrets.SEED_POPULATION_DATASET_URL }}
          SEED_ECONOMIC_INDICATORS_DATASET_URL: ${{ secrets.SEED_ECONOMIC_INDICATORS_DATASET_URL }}
          SEED_KRA_REVENUE_URL: ${{ secrets.SEED_KRA_REVENUE_URL || vars.SEED_KRA_REVENUE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(name)s %(levelname)s %(message)s')
          from bootstrap import initialize_reference_data
          if initialize_reference_data() is not True:
              logging.warning('Bootstrap seeding deferred or incomplete; inspect bootstrap logs and retained ownership before retry')
              raise SystemExit(2)
          print('Bootstrap seeding completed successfully')
          "

  # ══════════════════════════════════════════════════════════════════
  # Step 3: Domain seeding (economic indicators, debt, budgets, etc.)
  # ══════════════════════════════════════════════════════════════════
  seed:
    name: Seed Data Domains
    needs: [source_plan, migrate]
    outputs:
      report: ${{ steps.results.outputs.report }}
      source_diagnostics: ${{ steps.results.outputs.source_diagnostics }}
      report_version: ${{ steps.results.outputs.report_version }}
      cache_eligible: ${{ steps.results.outputs.cache_eligible }}
      classification: ${{ steps.results.outputs.classification }}
      source_sha: ${{ steps.results.outputs.source_sha }}
      schema_head: ${{ steps.results.outputs.schema_head }}
      plan_sha256: ${{ steps.results.outputs.plan_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AUDIT_GITHUB_DATABASE_TLS: '1'
      # Optional receipt storage. Enable only after owner-approved capacity,
      # private bucket/access, restart/readback and recovery acceptance (#137).
      # Server credential is deliberately restricted to the actual seeder job.
      SEED_RECEIPT_STORAGE_BACKEND: ${{ vars.SEED_RECEIPT_STORAGE_BACKEND || 'local' }}
      SEED_RECEIPT_SUPABASE_URL: ${{ vars.SEED_RECEIPT_SUPABASE_URL }}
      SEED_RECEIPT_SUPABASE_BUCKET: ${{ vars.SEED_RECEIPT_SUPABASE_BUCKET }}
      SEED_RECEIPT_R2_ACCOUNT_ID: ${{ vars.SEED_RECEIPT_R2_ACCOUNT_ID }}
      SEED_RECEIPT_R2_BUCKET: ${{ vars.SEED_RECEIPT_R2_BUCKET }}
      SEED_RECEIPT_R2_JURISDICTION: ${{ vars.SEED_RECEIPT_R2_JURISDICTION || 'default' }}
      SEED_RECEIPT_MAX_BYTES: ${{ vars.SEED_RECEIPT_MAX_BYTES }}
      SEED_RECEIPT_PART_MAX_BYTES: ${{ vars.SEED_RECEIPT_PART_MAX_BYTES }}
      SEED_RECEIPT_STORAGE_TIMEOUT_SECONDS: ${{ vars.SEED_RECEIPT_STORAGE_TIMEOUT_SECONDS || '30' }}
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Report the runner interpreter
        id: python
        run: /usr/bin/python3 -I -B --version
      - name: Record independent runner native diagnostics
        id: ocr
        run: >-
          /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8
          GITHUB_JOB="$GITHUB_JOB" /usr/bin/python3 -B
          tools/nightly_acceptance_20261105/native_jobs.py runner-diagnostics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
          architecture: x64
          check-latest: false
      - name: Require hosted native writer admission
        id: dependencies
        env:
          APPROVED_SHA: ${{ vars.INGESTION_WRITE_APPROVED_SHA }}
          NIGHTLY_ENABLED: ${{ vars.INGESTION_NIGHTLY_ENABLED }}
        run: python -I -B tools/nightly_acceptance_20261105/hosted_parser.py
      - name: Prepare verified writer TLS without copying credentials
        id: writer_tls
        run: python -I -B scripts/verification/github_database_qualify.py --prepare-writer-tls
      - name: Qualify this job's actual database connection
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -I -B scripts/verification/github_database_qualify.py --seed

      # Persist downloaded source PDFs across runs. The COB county BIRR PDF is
      # ~48MB and the CDN's throughput swings wildly (measured 50s → 556s for
      # the same file); once a report is fetched, later runs reuse the cached
      # copy and skip the download entirely, so a slow-CDN night can't eat the
      # per-domain budget and abort the run (issue #119).
      #
      # Key rotates weekly (ISO year-week) rather than per-run so we don't mint
      # a new ~48MB Actions cache on every nightly run (cache churn / quota).
      # The rolling restore-key means the first run of a week still restores the
      # previous week's snapshot, then re-saves under the new weekly key. BIRR
      # reports are quarterly, so a report published mid-week is at worst
      # re-downloaded (safely, under the wall-clock cap) until the next week's
      # key rotates it into the cache.
      - name: Compute PDF cache period (ISO year-week)
        id: pdf_cache_period
        run: echo "period=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"
      # Split restore/save. `actions/cache` skips its save step entirely when
      # the primary key was an exact hit, and the key here was constant for a
      # whole ISO week — so only the FIRST run of each week could ever add to
      # the cache. Every later run restored that Monday snapshot and
      # re-downloaded anything discovered since:
      #
      #   Cache hit for: seed-pdf-cache-2026-w36
      #   Cache Size: ~43 MB
      #   ... PDF cache miss; streaming download ... (x8, 198s)
      #
      # On 2026-09-06 both nightlies re-fetched the same 66MB — the 29.6MB
      # Treasury PBB alone took 158s — 15% of the global seed budget, on a run
      # that then ran out of budget and dropped four domains. The only cache
      # HIT in either run was a COB PDF 27 days old, i.e. nothing had been
      # saved in a month.
      - name: Restore downloaded source PDFs
        # A forced manual acquisition starts with this fresh runner's empty
        # cache, so an assembled range/old sidecar cannot stand in for HTTP200.
        if: env.SEED_PLAN_REACQUIRE_PENDING_BILLS_PDF != 'true' && env.SEED_PLAN_AUDITS_SOURCE_ACCEPTANCE == ''
        id: restore_pdfs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: backend/data/seeding/cache/pdfs
          # Deliberately unmatchable, so the restore always falls through to
          # the prefixes below and picks up the most recent snapshot.
          key: seed-pdf-cache-${{ steps.pdf_cache_period.outputs.period }}-${{ github.run_id }}
          restore-keys: |
            seed-pdf-cache-${{ steps.pdf_cache_period.outputs.period }}-
            seed-pdf-cache-

      - name: Capture the native run's job boundary
        id: native_boundary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python <<'PY'
          import os
          from sqlalchemy import text
          from database import engine
          with engine.connect() as connection:
              connection.execute(text('SET TRANSACTION READ ONLY'))
              connection.execute(text('SET LOCAL statement_timeout=3000'))
              floor = connection.scalar(text('SELECT COALESCE(max(id),0) FROM public.ingestion_jobs'))
              connection.rollback()
          if type(floor) is not int or not 0 <= floor < 10**18:
              raise SystemExit('Native job boundary refused')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('SEED_JOB_FLOOR='+str(floor)+'\n')
          PY

      - name: Seed planned domains
        id: cli
        timeout-minutes: 45
        env:
          SEED_BUDGETS_DATASET_URL: ${{ secrets.SEED_BUDGETS_DATASET_URL }}
          SEED_AUDITS_DATASET_URL: ${{ secrets.SEED_AUDITS_DATASET_URL }}
          SEED_POPULATION_DATASET_URL: ${{ secrets.SEED_POPULATION_DATASET_URL }}
          SEED_ECONOMIC_INDICATORS_DATASET_URL: ${{ secrets.SEED_ECONOMIC_INDICATORS_DATASET_URL }}
          SEED_KRA_REVENUE_URL: ${{ secrets.SEED_KRA_REVENUE_URL || vars.SEED_KRA_REVENUE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECEIPT_SUPABASE_SECRET_KEY: ${{ secrets.RECEIPT_SUPABASE_SECRET_KEY }}
          RECEIPT_R2_ACCESS_KEY_ID: ${{ secrets.RECEIPT_R2_ACCESS_KEY_ID }}
          RECEIPT_R2_SECRET_ACCESS_KEY: ${{ secrets.RECEIPT_R2_SECRET_ACCESS_KEY }}
          RECEIPT_R2_CONTROL_TOKEN: ${{ secrets.RECEIPT_R2_CONTROL_TOKEN }}
        run: |
          cd backend
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "job_floor=$SEED_JOB_FLOOR" >> "$GITHUB_OUTPUT"
          if python -m seeding.source_plan --execute; then
            cli_exit=0
          else
            cli_exit=$?
          fi
          echo 'executed=true' >> "$GITHUB_OUTPUT"
          echo "exit_code=$cli_exit" >> "$GITHUB_OUTPUT"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          exit "$cli_exit"

      # The save key must change whenever there is PROGRESS TO BANK, and not
      # otherwise. The previous version hashed completed `*.pdf` FILENAMES
      # only, which made the commonest kind of progress invisible: a night
      # that downloads 27MB of a 48MB PDF and is then stopped by the seed
      # budget leaves a `.part` file and the same *.pdf filename set it
      # started with, so it recomputed the SAME key, collided with the entry
      # already stored under it, and saved nothing.
      #
      # OBSERVED on five consecutive nightlies (runs 34799406076, 34921218282,
      # 35048000013, 35174426953, 35299414702) — a stalled cache and, with it,
      # a stalled download:
      #
      #   Sep 14  Cache saved with key: seed-pdf-cache-2026-w38-c72cd0b7025eea9d
      #   Sep 15  Failed to save: Unable to reserve cache with key
      #             seed-pdf-cache-2026-w38-c72cd0b7025eea9d
      #   Sep 16  Failed to save: ... (same key)
      #   Sep 17  Failed to save: ... (same key)
      #   Sep 18  Failed to save: ... (same key)
      #
      #   Sep 15..18 each: "resuming from 27751154 bytes" — byte-identical,
      #   four nights running. Real progress was made every one of those
      #   nights and thrown away every one of those nights.
      #
      # The fingerprint now covers every file in the directory, so a grown
      # `.part` and a refreshed TTL sidecar both move the key. See
      # .github/scripts/pdf_cache_fingerprint.py for the rule and the reasons,
      # and backend/tests/test_pdf_cache_banks_progress.py, which runs this
      # step for real over a simulated week.
      # The period arrives through `env:` rather than being interpolated into
      # the script. A `${{ }}` inside a run: block is pasted in as text before
      # the shell sees it, which is the same seam that broke every nightly from
      # 2026-09-03 — and it makes test_workflow_inline_scripts.py skip the step
      # instead of checking it.
      - name: Fingerprint the PDF cache
        if: always() && steps.dependencies.outcome == 'success'
        id: pdf_cache_state
        env:
          PDF_CACHE_PERIOD: ${{ steps.pdf_cache_period.outputs.period }}
        run: |
          python3 .github/scripts/pdf_cache_fingerprint.py \
            backend/data/seeding/cache/pdfs \
            "seed-pdf-cache-${PDF_CACHE_PERIOD}-"

      # Two guards, both of which the old unconditional save needed and did
      # not have:
      #
      # `files > 0` — never store an empty directory. `actions/cache` restores
      # the NEWEST entry matching the prefix, so an empty snapshot saved by a
      # run that died before its first download (this step is `if: always()`)
      # would become that newest entry and delete every banked partial on the
      # following night. Now that the key tracks content, that save would
      # succeed rather than collide, so the hazard is real and new.
      #
      # `!= cache-matched-key` — when nothing changed, the restored entry is
      # already exactly what we would upload. Skipping keeps the weekly-key
      # frugality #175 was after, and keeps "Unable to reserve cache" out of
      # the log, where it reads as a failure rather than as a no-op.
      - name: Save downloaded source PDFs
        id: save_pdfs
        # Keep the ordinary all-source cache bank intact after a one-source
        # qualification; do not replace its latest snapshot with one PDF.
        if: always() && steps.dependencies.outcome == 'success' && env.SEED_PLAN_REACQUIRE_PENDING_BILLS_PDF != 'true' && env.SEED_PLAN_AUDITS_SOURCE_ACCEPTANCE == '' && steps.pdf_cache_state.outputs.files != '0' && steps.pdf_cache_state.outputs.key != steps.restore_pdfs.outputs.cache-matched-key
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: backend/data/seeding/cache/pdfs
          key: ${{ steps.pdf_cache_state.outputs.key }}

      - name: Check ingestion job results
        id: results
        if: ${{ !cancelled() && steps.database.outcome == 'success' && steps.native_boundary.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ADMITTED_SHA: ${{ needs.migrate.outputs.source_sha }}
          SEED_SCHEMA_HEAD: ${{ needs.migrate.outputs.schema_head }}
          SEED_PLANNED_SHA: ${{ needs.source_plan.outputs.source_sha }}
          SEED_PLANNED_IDENTITY: ${{ needs.source_plan.outputs.plan_sha256 }}
          SEED_PRIOR_SUCCESS: ${{ job.status == 'success' }}
          SEED_PRIOR_JOB_STATUS: ${{ job.status }}
          SEED_PRIOR_STEPS: ${{ toJSON(steps) }}
          SEED_CLI_OUTCOME: ${{ steps.cli.outcome }}
          SEED_CLI_EXECUTED: ${{ steps.cli.outputs.executed }}
          SEED_CLI_EXIT: ${{ steps.cli.outputs.exit_code }}
          SEED_CLI_RUN_ID: ${{ steps.cli.outputs.run_id }}
          SEED_CLI_RUN_ATTEMPT: ${{ steps.cli.outputs.run_attempt }}
          SEED_CLI_FLOOR: ${{ steps.cli.outputs.job_floor }}
          SEED_CLI_STARTED: ${{ steps.cli.outputs.started_at }}
          SEED_CLI_FINISHED: ${{ steps.cli.outputs.finished_at }}
        run: |
          cd backend
          # Quoted heredoc, NOT `python -c "..."`. With python -c the script
          # lives inside a double-quoted shell string, so a single double quote
          # anywhere in the Python terminates it: the shell then parsed the
          # rest as a pipeline ("or: command not found") and Python received a
          # truncated line ("NameError: name 'f' is not defined"). That killed
          # every nightly from 2026-09-03, freezing production data, because
          # the offending line was a routine f-string. <<'PY' quotes nothing.
          python <<'PY'
          import sys
          import os
          import re
          from database import SessionLocal
          from models import IngestionJob, IngestionStatus

          from seeding.staleness import (
              NON_PUBLISHER_DOMAINS,
              hollow_run_findings,
          )
          from seeding.source_plan import environment_plan

          raw_floor = os.environ.get('SEED_JOB_FLOOR', '')
          if not re.fullmatch('[0-9]{1,18}', raw_floor):
              raise SystemExit('Native job boundary missing or refused')
          plan = environment_plan()
          domains = plan.domains

          session = SessionLocal()
          # The retained pre-seed ID floor bounds this invocation's results.
          # A fixed age window would hide early jobs in a healthy 33–40 min run.
          jobs = session.query(IngestionJob).filter(
              IngestionJob.id > int(raw_floor),
          ).order_by(IngestionJob.id.desc()).limit(19).all()

          from seeding.current_run import classify, environment_context, publish, publish_diagnostics
          context = environment_context()
          current = classify(jobs, plan, context)
          publish_diagnostics(jobs, current, context)
          failed = 0
          print('\n--- Ingestion Job Results ---')
          missing = sorted(set(domains) - {job.domain for job in jobs})
          for domain in missing:
              print(f'[MISSING] {domain}: no job after the native run boundary')
          for job in jobs:
              status = job.status.value
              mode = (job.meta or {}).get('source_mode')
              # A domain that served a git-tracked fixture is NOT [OK]: it
              # published nothing from the publisher, and its 0-created count
              # reflects a static file rather than a confirmed no-op upstream.
              #
              # partial and refused are named too. They used to fall through
              # to [OK] because the chain tested `fixture` and then `status`,
              # and both of those modes complete cleanly — so a domain whose
              # headline figure never moved printed exactly like one that
              # refreshed. freshness.py declares five modes; this prints five.
              if job.domain == 'learning_hub' and mode == 'fixture' and (job.meta or {}).get('source_fallback_reason') == 'no_live_source':
                  emoji = 'REFERENCE'
              elif job.domain == 'county_officials' and mode == 'fixture' and job.items_processed == job.items_created == job.items_updated == 0:
                  emoji = 'UNAVAILABLE'
              elif mode == 'fixture':
                  emoji = 'STALE'
              elif mode == 'refused':
                  emoji = 'REFUSED'
              elif mode == 'partial':
                  emoji = 'PARTIAL'
              elif status == 'completed':
                  emoji = 'OK'
              elif status == 'completed_with_errors':
                  emoji = 'WARN'
              else:
                  emoji = 'FAIL'
              src = f" | source={mode or 'unrecorded'}"
              reason = (job.meta or {}).get('source_fallback_reason')
              if reason:
                  src += f' ({reason})'
              print(f'[{emoji}] {job.domain}: {status} | created={job.items_created} updated={job.items_updated} processed={job.items_processed}{src}')
              from seeding.current_run import source_diagnostics
              diagnostic, _ = source_diagnostics(job)
              if diagnostic is not None:
                  import json
                  print('SOURCE_DIAGNOSTICS_V1 '+json.dumps(diagnostic,separators=(',',':'),allow_nan=False))
              # Numerical writes and immutable source-byte retention are separate
              # outcomes. Preserve the observation contract without hiding gaps.
              from services.receipt_retention import safe_retention_summary
              retention = safe_retention_summary((job.meta or {}).get('receipt_retention'))
              if retention['state'] == 'missing_bytes':
                  print(f"  [RECEIPT WARNING] {job.domain}: {retention['missing']} unconfirmed source captures; numerical completion does not prove retained evidence")
              elif retention['state'] == 'unverified':
                  print(f'  [RECEIPT WARNING] {job.domain}: retention outcome unknown')
              elif retention['state'] == 'not_observed':
                  print(f'  [RECEIPT INFO] {job.domain}: no source captures observed; retention not qualified')
              else:
                  print(f"  [RECEIPT OK] {job.domain}: {retention['retained']} verified captures; {retention['recovered']} recovered after retry")
              for phase, reasons in sorted(retention.get('diagnostics', {}).items()):
                  for reason, count in sorted(reasons.items()):
                      print(f'  [RECEIPT DIAGNOSTIC] {job.domain}: {phase} {reason}={count}')
              if job.errors:
                  print(f'  ERROR COUNT: {len(job.errors)}; inspect retained job evidence privately')
              if status not in {'completed', 'completed_with_errors'}:
                  failed += 1

          # A run that refreshed NOTHING must not report success.
          #
          # 2026-09-19, run 35415601792: audits processed=0 (all five OAG
          # URLs returned HTML, not PDFs), counties_budget fell back after a
          # COB 403, national_budget too. The table above printed [STALE] for
          # five domains and this step then printed "All domains completed
          # successfully." and exited 0, because it counted only
          # status == 'failed'. The validate job, minutes later, printed
          # "[OK] audits ingestion: reached the publisher in 13/22 recent
          # run(s)" — it judges a 14-day window, so one hollow night is
          # invisible to it by construction.
          #
          # hollow_run_findings asks the question neither of them asked: did
          # THIS run reach the publisher? Its exemptions are the same two
          # reason slugs the window gate already exempts (no_live_source,
          # fixture_superseded), so learning_hub — which has no publisher —
          # stays green (stalled_projects did too, until #230 gave it COB),
          # and a broken fetch cannot exempt itself. The rule lives in
          # seeding/staleness.py, tested by
          # backend/tests/test_hollow_run_gate.py, which runs THIS step.
          # Every finding is printed; only FAIL-level ones stop the run.
          # partial is WARN on purpose — a secondary series did refresh, and
          # revenue_by_source has been partial for ~20 consecutive runs, so
          # failing on it would paint every night red and the gate would be
          # muted along with everything beside it.
          findings = hollow_run_findings(jobs)
          for finding in findings:
              print(f'  {finding}')
          hollow = [f for f in findings if f.level == 'FAIL']

          # These domains require complete source/extraction/loading outcomes.
          # A successful secondary series or a protected reconciliation hold
          # must not certify the full nightly. Other PARTIAL policies stay WARN.
          from seeding.refresh_completion import required_refresh_failures
          incomplete = required_refresh_failures(jobs, dry_run=plan.dry_run)
          for diagnostic in incomplete:
              print(diagnostic)

          # No rows at all is the same defect one step further back: the
          # loop above prints nothing, `failed` stays 0, and the step reports
          # a success it never observed. The seed step always writes a job
          # per domain it starts, so an empty table means the seeder did not
          # get that far.
          graded = [j for j in jobs if j.domain not in NON_PUBLISHER_DOMAINS]
          if not graded:
              print(
                  '\nNo ingestion job rows after the native run boundary. The seeder '
                  'recorded nothing, so there is nothing to call successful.'
              )

          session.close()
          # Eligibility is terminal output. An unknown exception in diagnostics,
          # grading, session cleanup or logging must leave no eligible report.
          if failed or hollow or not graded or missing:
              current = dict(current, classification='unsafe', cache_eligible=False,
                             refusals=sorted(set(current['refusals']) | {'job_result_refused'}))
          if current['classification'] == 'unsafe' or failed or hollow or incomplete or not graded or missing:
              if failed:
                  print(f'\n{failed} domain(s) failed!')
              if hollow:
                  print(
                      f'\n{len(hollow)} domain(s) have unavailable, fallback or '
                      'unrecorded source evidence: this run cannot establish current coverage, so '
                      'it is not a success.'
                  )
              publish(current)
              sys.exit(1)
          source_gaps = [f for f in findings if f.level == 'WARN']
          ingestion_warnings = [j for j in jobs if j.status == IngestionStatus.COMPLETED_WITH_ERRORS or j.errors]
          warning_count = len(source_gaps) + len(ingestion_warnings)
          if warning_count:
              print(f'\nRefresh completed with source gaps or ingestion warnings: {warning_count} warning(s). Review the PARTIAL, STALE and WARN results above.')
          else:
              print('\nAll domains completed successfully.')
          publish(current)
          PY

  # ══════════════════════════════════════════════════════════════════
  # Step 4: Data validation — verify tables have data and key metrics are sane
  # ══════════════════════════════════════════════════════════════════
  validate:
    name: Validate Data Integrity
    needs: [migrate, seed, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_GITHUB_DATABASE_TLS: '1'
    # Runs even when seeding failed. The freshness gates report on the state of
    # the DATABASE, which is exactly what an operator needs to see on a bad
    # night — and previously did not: the 2026-09-06 03:19 nightly skipped this
    # job entirely because the seed job was red, so nothing checked whether the
    # published data had gone stale. Keeping it independent is also what lets
    # a truncated seed run report itself as failed (seeding/cli.py) instead of
    # staying green to protect this job.
    if: ${{ !cancelled() && needs.migrate.result == 'success' && github.event.inputs.run_validation != 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record independent runner native diagnostics
        run: >-
          /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8
          GITHUB_JOB="$GITHUB_JOB" /usr/bin/python3 -B
          tools/nightly_acceptance_20261105/native_jobs.py runner-diagnostics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
          architecture: x64
          check-latest: false
      - name: Require hosted native writer admission
        env:
          APPROVED_SHA: ${{ vars.INGESTION_WRITE_APPROVED_SHA }}
          NIGHTLY_ENABLED: ${{ vars.INGESTION_NIGHTLY_ENABLED }}
        run: python -I -B tools/nightly_acceptance_20261105/hosted_parser.py
      - name: Prepare verified writer TLS without copying credentials
        run: python -I -B scripts/verification/github_database_qualify.py --prepare-writer-tls
      - name: Qualify this job's actual database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -I -B scripts/verification/github_database_qualify.py --seed

      # Validation runs on a separate runner: the seed job's filesystem is
      # absent here. Restore its official byte cache, then prepare missing
      # reviewed county editions explicitly before read-only FULL gates.
      - name: Restore retained source PDFs for validation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: backend/data/seeding/cache/pdfs
          key: seed-pdf-validation-${{ github.run_id }}
          restore-keys: |
            seed-pdf-cache-

      - name: Prepare reviewed retained county-source bytes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m seeding.source_cache \
            --database-url-env DATABASE_URL --profile county --fetch \
            --receipt ../retained-source-cache-validation.json

      - name: Validate seeded data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -c "
          import sys
          from database import SessionLocal
          from models import (
              Entity, EntityType, Audit, BudgetLine, Loan, PopulationData,
              GDPData, EconomicIndicator, PovertyIndex, DebtTimeline,
              FiscalSummary, FiscalPeriod,
          )
          from sqlalchemy import func

          session = SessionLocal()
          errors = []
          warnings = []
          # Every count check() sees, kept for the row-count regression gate
          # below. The floors answer 'is this table catastrophically empty?';
          # these same numbers, compared against what earlier runs observed,
          # answer 'did this table just LOSE most of its rows?' — which no
          # absolute floor here can answer. See seeding/staleness.py.
          observed = {}

          def check(label, query_count, min_expected, is_warning=False):
              count = query_count
              observed[label] = count
              status = 'OK' if count >= min_expected else ('WARN' if is_warning else 'FAIL')
              print(f'[{status}] {label}: {count} rows (expected >= {min_expected})')
              if count < min_expected:
                  msg = f'{label}: {count} rows (expected >= {min_expected})'
                  if is_warning:
                      warnings.append(msg)
                  else:
                      errors.append(msg)

          # ── Core reference data ──
          check('Counties',
                session.query(Entity).filter(Entity.type == EntityType.COUNTY).count(),
                47)
          check('National Entity',
                session.query(Entity).filter(Entity.type == EntityType.NATIONAL).count(),
                1)
          check('Fiscal Periods',
                session.query(FiscalPeriod).count(),
                1)

          # ── Budget data ──
          check('Budget Lines',
                session.query(BudgetLine).count(),
                400)

          # ── Audit data ──
          # Thresholds are REGRESSION FLOORS, not targets. The honest
          # post-purge baseline is 25 real national/ministry audits (the
          # 512 fabricated county rows were removed 2026-07-07); the live
          # OAG OCR path adds real findings on top over time. Floors sit
          # below 25 so a catastrophic loss still fails the gate, without
          # demanding growth the upstream can't guarantee on any one night.
          # (Pipeline health — did live ingestion actually persist? — is
          # tracked by the ingestion-job counts + the audits-domain
          # fetch↔parse WARN, not by inflating this floor.)
          total_audits = session.query(Audit).count()
          check('Audit Records', total_audits, 20)
          # The provenance middle link. This was 0 for the project's whole
          # history (AUDIT_FINDINGS finding 2); Stage 2's extractor keeps
          # it populated, and losing every extraction row is a hard fail.
          from models import Extraction
          check('Extractions (provenance middle link)',
                session.query(Extraction).count(),
                1)
          check('Publishable audits with extraction provenance',
                session.query(Audit).filter(
                    Audit.extraction_id.isnot(None),
                    Audit.page_ref.isnot(None),
                    Audit.source_hash.isnot(None),
                ).count(),
                1)
          audits_with_year = session.query(Audit).filter(Audit.audit_year.isnot(None)).count()
          check('Audits with audit_year', audits_with_year, 20)
          audits_with_type = session.query(Audit).filter(Audit.query_type.isnot(None)).count()
          check('Audits with query_type', audits_with_type, 20)

          # ── Population data ──
          check('Population Records',
                session.query(PopulationData).count(),
                48)
          check('National Population (entity_id=NULL)',
                session.query(PopulationData).filter(PopulationData.entity_id.is_(None)).count(),
                1)

          # ── GDP data ──
          check('GDP Records (entity-linked)',
                session.query(GDPData).filter(GDPData.entity_id.isnot(None)).count(),
                5)
          check('GDP Records (national, entity_id=NULL)',
                session.query(GDPData).filter(GDPData.entity_id.is_(None)).count(),
                5, is_warning=True)

          # ── Economic indicators ──
          check('Economic Indicators',
                session.query(EconomicIndicator).count(),
                5)
          check('Inflation Rate records',
                session.query(EconomicIndicator).filter(EconomicIndicator.indicator_type == 'inflation_rate').count(),
                1)
          check('Unemployment Rate records',
                session.query(EconomicIndicator).filter(EconomicIndicator.indicator_type == 'unemployment_rate').count(),
                1)

          # ── Poverty data ──
          check('Poverty Index Records',
                session.query(PovertyIndex).count(),
                1, is_warning=True)

          # ── Debt data ──
          check('Loan Records',
                session.query(Loan).count(),
                50)
          check('Debt Timeline',
                session.query(DebtTimeline).count(),
                5, is_warning=True)
          check('Fiscal Summaries',
                session.query(FiscalSummary).count(),
                3, is_warning=True)

          # ── Sanity checks: values in reasonable ranges ──
          from seeding.staleness import national_population_sanity
          population_ok, population_message = national_population_sanity(session)
          if not population_ok:
              errors.append(population_message)
          print(('' if population_ok else '[FAIL] ') + population_message)

          latest_gdp = session.query(GDPData).filter(
              GDPData.entity_id.is_(None)
          ).order_by(GDPData.year.desc()).first()
          if latest_gdp:
              gdp_trillions = float(latest_gdp.gdp_value) / 1e12
              if gdp_trillions < 5 or gdp_trillions > 30:
                  errors.append(f'National GDP out of range: {gdp_trillions:.1f}T KES')
                  print(f'[FAIL] GDP sanity: {gdp_trillions:.1f}T KES')
              else:
                  print(f'[OK] GDP sanity: {gdp_trillions:.1f}T KES (year {latest_gdp.year})')

          # ── Freshness gates ────────────────────────────────────
          # Row-count floors above ('27 rows >= 20') pass forever and did:
          # they reported [OK] every night for months while audits had not
          # gained a row in 6 weeks and budget_lines in 11. These gates ask
          # the three questions a floor cannot — has the data MOVED, did
          # the pipeline actually reach the PUBLISHER, and has any table
          # LOST rows against what earlier runs saw? See
          # backend/seeding/staleness.py.
          #
          # The floors above are kept, and are now only what they can
          # honestly be: DISASTER detectors for an empty or half-migrated
          # database, plus tight structural assertions on reference data
          # (47 counties is 47 counties). On 2026-09-07 they read
          # 'Budget Lines: 2136 rows (expected >= 400)' and
          # 'Extractions: 2325 rows (expected >= 1)' — 81% and 99.96%
          # headroom. Fourteen of the twenty still print [OK] against a
          # database that has lost four fifths of its rows, which is what
          # the regression gate is here to catch instead.
          from seeding.staleness import FAIL, WARN, run_all

          print('\n--- Freshness gates ---')
          for finding in run_all(session, counts=observed):
              print(f'  {finding}')
              if finding.level == FAIL:
                  errors.append(f'{finding.label}: {finding.message}')
              elif finding.level == WARN:
                  warnings.append(f'{finding.label}: {finding.message}')

          session.close()

          print(f'\n--- Summary ---')
          print(f'Errors: {len(errors)}, Warnings: {len(warnings)}')
          if errors:
              print('CRITICAL ERRORS:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          if warnings:
              print('Warnings (non-blocking):')
              for w in warnings:
                  print(f'  - {w}')
          print('Data validation passed.')
          "

  # ══════════════════════════════════════════════════════════════════
  # Step 5: Freshness loop (Layer 8): clear the API cache, then the pages
  # ══════════════════════════════════════════════════════════════════
  # New data has to reach the pages without a deploy (issue #231). Two
  # caches sit between the database and a reader, and they are cleared in
  # this order:
  #   1. The API's response caches (Render). Without this, a regenerated page
  #      is rebuilt from the pre-seed response, which can be up to 6 hours old.
  #   2. The prerendered pages (Vercel). Paths come from
  #      frontend/lib/revalidation/paths.json, the same file the route uses
  #      as its allowlist, so the two cannot disagree.
  # Both requests are HMAC-SHA256-signed with REVALIDATE_SECRET. Runs only
  # after verified execution and integrity on a non-dry run. Known required
  # source incompleteness stays red while accepted independent data can refresh.
  #
  # This job FAILS if the secret is missing, if either call does not
  # answer 200, or if any page path is rejected. Before #231 a missing
  # secret was a warning and a rejected path was ignored, and the loop
  # stayed open for weeks while the run showed green.
  revalidate:
    name: Refresh API Cache and Pages
    needs: [source_plan, migrate, seed, bootstrap, validate]
    if: >-
      ${{ !cancelled() &&
          needs.source_plan.result == 'success' && needs.migrate.result == 'success' &&
          needs.validate.result == 'success' &&
          needs.source_plan.outputs.dry_run == 'false' &&
          needs.source_plan.outputs.source_sha == github.sha &&
          needs.migrate.outputs.source_sha == github.sha &&
          needs.migrate.outputs.schema_head == 'a756b20a0001' &&
          needs.seed.outputs.source_sha == github.sha &&
          needs.seed.outputs.schema_head == needs.migrate.outputs.schema_head &&
          needs.seed.outputs.plan_sha256 != '' &&
          needs.seed.outputs.plan_sha256 == needs.source_plan.outputs.plan_sha256 &&
          needs.seed.outputs.report_version == '1' && needs.seed.outputs.cache_eligible == 'true' &&
          ((needs.seed.result == 'success' && needs.seed.outputs.classification == 'complete') ||
           (needs.seed.result == 'failure' && needs.seed.outputs.classification == 'required_source_incomplete')) &&
          ((needs.source_plan.outputs.bootstrap == 'true' && needs.bootstrap.result == 'success') ||
           (needs.source_plan.outputs.bootstrap == 'false' && needs.bootstrap.result == 'skipped')) }}
    outputs:
      backend: ${{ steps.invalidate.outputs.acknowledged }}
      pages: ${{ steps.pages.outputs.acknowledged }}
      protocol: ${{ steps.invalidate.outputs.protocol }}
      source_sha: ${{ steps.invalidate.outputs.source_sha }}
      plan_sha256: ${{ steps.invalidate.outputs.plan_sha256 }}
      run_id: ${{ steps.invalidate.outputs.run_id }}
      run_attempt: ${{ steps.invalidate.outputs.run_attempt }}
      evidence_sha256: ${{ steps.pages.outputs.evidence_sha256 || steps.invalidate.outputs.evidence_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://audit-app-4pwa.onrender.com' }}
      REVALIDATE_URL: ${{ vars.REVALIDATE_URL || 'https://www.auditgava.com/api/revalidate' }}
      REFRESH_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: |
            frontend/lib/revalidation/paths.json
            .github/scripts/seed_notifications.cjs
            backend/seeding/current_run.py
            scripts/verification/nightly_workflow/refresh.py
            scripts/verification/nightly_workflow/evidence.cjs
          sparse-checkout-cone-mode: false

      - name: Verify exact refresh eligibility before HTTP
        env:
          REFRESH_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 <<'PY'
          import json, os, re
          def require(ok):
              if not ok:
                  raise SystemExit('Exact current-run refresh eligibility refused')
          needs = json.loads(os.environ['REFRESH_NEEDS'])
          require(type(needs) is dict and set(needs) == {'source_plan','migrate','seed','bootstrap','validate'})
          require(all(needs[k].get('result') == 'success' for k in ('source_plan','migrate','validate')))
          plan, admitted, seed = (needs[k]['outputs'] for k in ('source_plan','migrate','seed'))
          require(plan.get('dry_run') == 'false' and seed.get('cache_eligible') == 'true' and seed.get('report_version') == '1')
          sha, identity = os.environ['GITHUB_SHA'], plan.get('plan_sha256')
          require(re.fullmatch('[0-9a-f]{40}',sha) is not None and type(identity) is str and re.fullmatch('[0-9a-f]{64}',identity) is not None)
          require(all(o.get('source_sha') == sha for o in (plan,admitted,seed)))
          require(seed.get('plan_sha256') == identity and admitted.get('schema_head') == seed.get('schema_head') == 'a756b20a0001')
          classification = seed.get('classification')
          require((needs['seed']['result'],classification) in (('success','complete'),('failure','required_source_incomplete')))
          require((plan.get('bootstrap'),needs['bootstrap']['result']) in (('true','success'),('false','skipped')))
          report = json.loads(seed['report'])
          require(type(report) is dict and type(report.get('version')) is int and report['version'] == 1)
          require(report.get('source_sha') == sha and report.get('plan_sha256') == identity and report.get('schema_head') == 'a756b20a0001')
          require(report.get('run_id') == os.environ['GITHUB_RUN_ID'] and report.get('run_attempt') == os.environ['GITHUB_RUN_ATTEMPT'])
          require(report.get('cache_eligible') is True and report.get('dry_run') is False and report.get('cli_executed') is True)
          require(type(report.get('cli_exit')) is int and report['cli_exit'] == 0 and report.get('cli_exit_zero') is True)
          require(report.get('classification') == classification and report.get('bootstrap_selected') is (plan['bootstrap'] == 'true'))
          domains = json.loads(plan['domains'])
          require(type(domains) is list and 1 <= len(domains) <= 18 and report.get('selected_domains') == domains)
          print('Exact current-run phase identities verified; checking the typed inventory.')
          PY
          node .github/scripts/seed_notifications.cjs --verify-refresh

      - name: Require the signing secret
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_SECRET is not configured. The seed wrote new data, but the API cache and the prerendered pages will go on serving the old data until TTLs expire or someone deploys. Set the same value in GitHub Actions secrets, in Vercel and in Render (see PR for #231)."
            exit 1
          fi

      - name: Invalidate the API's response caches
        id: invalidate
        run: |
          python3 scripts/verification/nightly_workflow/refresh.py backend \
            --state "$RUNNER_TEMP/nightly-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --evidence "$RUNNER_TEMP/nightly-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"

      - name: Revalidate the prerendered pages
        id: pages
        run: |
          python3 scripts/verification/nightly_workflow/refresh.py pages \
            --state "$RUNNER_TEMP/nightly-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --evidence "$RUNNER_TEMP/nightly-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"

  # ══════════════════════════════════════════════════════════════════
  # Step 6: Summary and notifications
  # ══════════════════════════════════════════════════════════════════
  notify:
    name: Post-Run Summary
    needs: [source_plan, healthcheck, migrate, seed, bootstrap, validate, revalidate]
    if: always() && (github.event_name != 'schedule' || vars.INGESTION_NIGHTLY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Create summary
        env:
          SEED_PLAN_RESULT: ${{ needs.source_plan.result }}
          SEED_PLANNED_DOMAINS: ${{ needs.source_plan.outputs.domains }}
          SEED_PLANNED_BOOTSTRAP: ${{ needs.source_plan.outputs.bootstrap }}
        run: |
          # Selection is separate from execution. Missing/refused plans have
          # no admitted domains even when the requested domain was left blank.
          if [ "$SEED_PLAN_RESULT" != "success" ]; then
            SEED_PLANNED_DOMAINS="unverified (plan refused or unavailable)"
            SEED_PLANNED_BOOTSTRAP="unverified"
          fi
          echo "## Database Seeding Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Run Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Domain** | ${SEED_PLAN_DOMAIN:-all (default plan)} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Planned Domains** | $SEED_PLANNED_DOMAINS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Plan Status** | $SEED_PLAN_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bootstrap Planned** | $SEED_PLANNED_BOOTSTRAP |" >> $GITHUB_STEP_SUMMARY
          echo "| **Database Admission** | ${{ needs.migrate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bootstrap Status** | ${{ needs.bootstrap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ${{ needs.healthcheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Seed Status** | ${{ needs.seed.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Validation** | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cache / page refresh** | ${{ needs.revalidate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [seeding guide](https://github.com/${{ github.repository }}/blob/main/docs/seeding-guide.md) for details." >> $GITHUB_STEP_SUMMARY

      - name: Create issue on URL health-check failure
        if: needs.healthcheck.outputs.has_failures == 'true'
        env:
          HEALTH_REPORT: ${{ needs.healthcheck.outputs.report }}
          HEALTH_PLAN: ${{ needs.source_plan.outputs.plan_sha256 }}
          HEALTH_INVENTORY: ${{ needs.healthcheck.outputs.inventory_sha256 }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // Parse the health-check report to build a readable table
            const report = process.env.HEALTH_REPORT || '';
            const plan = process.env.HEALTH_PLAN, inventory = process.env.HEALTH_INVENTORY;
            if (![plan,inventory].every(x => typeof x === 'string' && /^[0-9a-f]{64}$/.test(x))) throw new Error('Health issue scope unverified');
            const scopeMarker = `<!-- seed-health-scope:${plan}:${inventory} -->`;
            const lines = report.trim().split('\n').filter(l => l.trim());

            let tableRows = '';
            const failedSources = [];
            for (const line of lines) {
              const parts = line.split('|');
              const [status, label, code] = parts;
              if (parts.length !== 3 || !/^(OK|WARNING|CRITICAL)$/.test(status) ||
                  !/^[a-zA-Z0-9_ .:/-]{1,512}$/.test(label) ||
                  !/^(\d{3}|timeout|connection refused|incomplete response|TLS certificate verification failed|bounded body probe refused or exceeds byte limit|transport error \d{1,3}|not probed - coverage unknown|required diagnostic coverage unavailable|curated reference; no live publisher expected)$/.test(code)) {
                throw new Error('Health report contains an unverified row');
              }
              if (status === 'CRITICAL' || status === 'WARNING') {
                const icon = status === 'CRITICAL' ? '🔴' : '🟡';
                tableRows += `| ${icon} ${status} | ${label} | ${code} |\n`;
                if (status === 'CRITICAL') failedSources.push(label);
              }
            }

            // Check for existing open issue to avoid duplicates
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-source-down,automated',
              per_page: 100,
              state: 'open',
            });

            const today = new Date().toISOString().split('T')[0];
            if (!failedSources.length) throw new Error('Health failures missing from report');
            const title = `⚠️ Data source health: ${failedSources.length} critical findings — ${today}`;
            const body = [
              `## Data Source Health Check Failed`,
              scopeMarker,
              ``,
              `The selected plan has **${failedSources.length} critical** source diagnostic failure(s) or unknown coverage; inspect each outcome below.`,
              ``,
              `### Affected Sources`,
              ``,
              `| Status | Source | Outcome |`,
              `|--------|--------|---------|`,
              tableRows,
              ``,
              `### What This Means`,
              `- Probes cover the selected plan component endpoints and discovered Treasury editions; reachability is separate from extraction, edition acceptance and publication`,
              `- Affected domains may have **stale or missing data**`,
              `- Government websites (OAG, COB, CBK) occasionally restructure their URLs`,
              `- External APIs (World Bank, IMF) may have temporary outages`,
              ``,
              `### Action Required`,
              `1. Check the named source against its configured endpoint or the publisher catalogue`,
              `2. Look at the [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details`,
              `3. Keep the incident open until a completed probe verifies recovery; the pipeline retries nightly`,
              `4. If the URL has permanently changed, update the source URLs in:`,
              `   - \`backend/seeding/domains/*/fetcher.py\``,
              `   - \`backend/seeding/config.py\``,
              `   - \`backend/routers/data_provenance.py\``,
              ``,
              `### Common URL Migrations`,
              `| Site | Old Pattern | New Pattern |`,
              `|------|------------|-------------|`,
              `| COB | \`cob.go.ke/reports/\` | \`cob.go.ke/publications/\` |`,
              `| OAG | \`oagkenya.go.ke/reports/\` | \`oagkenya.go.ke/\` (root) |`,
              `| Treasury | \`newsite.treasury.go.ke/\` | \`www.treasury.go.ke/\` |`,
              ``,
              `> \`newsite.treasury.go.ke\` is the LEGACY host. It survives only in`,
              `> \`etl/kenya_pipeline.py\` and \`etl/smoke_test.py\`, which the nightly`,
              `> does not run. Every Treasury URL in \`seeding/config.py\` is`,
              `> \`www.treasury.go.ke\`. This table used to point the other way and`,
              `> would have walked a maintainer into reverting #138.`,
              ``,
              `---`,
              `*Auto-generated by the Database Seeding & Data Refresh workflow*`,
            ].join('\n');

            // Preserve unresolved scope markers: recovery for A cannot clear B.
            // Multiple distinct scopes require review; no blanket auto-close.
            if (!Array.isArray(existingIssues.data) || existingIssues.data.length > 1) throw new Error('Health incident inventory ambiguous');
            if (existingIssues.data.length > 0) {
              const existing = existingIssues.data[0];
              const previousBody = typeof existing.body === 'string' ? existing.body : '';
              const legacy = /<!-- seed-health-scope:[0-9a-f]{64}:[0-9a-f]{64} -->/.test(previousBody)
                ? '' : '\n<!-- seed-health-scope:legacy-unverified -->';
              if (!previousBody.includes(scopeMarker)) {
                if (previousBody.length > 55000) throw new Error('Health incident scope history exceeds bound');
                await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,
                  issue_number:existing.number,body:previousBody+legacy+'\n'+scopeMarker});
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Update — ${today}\n\nHealth check still failing:\n\n${tableRows}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              console.log(`Commented on existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'data-pipeline', 'data-source-down', 'automated'],
              });
              console.log('Created new health-check failure issue');
            }

      - name: Auto-close resolved health-check issues
        # `unprobed == '0'` as well: a run that ran out of budget before
        # reaching a source has not shown that source to be reachable.
        if: needs.healthcheck.result == 'success' && needs.healthcheck.outputs.critical_reachable == 'true' && needs.healthcheck.outputs.unprobed == '0'
        env:
          HEALTH_PLAN: ${{ needs.source_plan.outputs.plan_sha256 }}
          HEALTH_INVENTORY: ${{ needs.healthcheck.outputs.inventory_sha256 }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // All critical sources were reachable this run — close any
            // open data-source-down issues so a transient WAF block (415)
            // that self-heals overnight doesn't linger as an open bug.
            const plan = process.env.HEALTH_PLAN, inventory = process.env.HEALTH_INVENTORY;
            if (![plan,inventory].every(x => typeof x === 'string' && /^[0-9a-f]{64}$/.test(x))) throw new Error('Health recovery scope unverified');
            const scopeMarker = `<!-- seed-health-scope:${plan}:${inventory} -->`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Require BOTH labels (comma = AND) so we only auto-close
              // issues THIS workflow created — every generated outage issue
              // carries data-source-down + automated. A human-filed
              // investigative issue using only data-source-down is spared.
              labels: 'data-source-down,automated',
              per_page: 100,
              state: 'open',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!Array.isArray(open.data) || open.data.length >= 100) throw new Error('Health recovery issue inventory ambiguous');
            for (const issue of open.data) {
              if (typeof issue.body !== 'string' || issue.body.includes('<!-- seed-health-scope:legacy-unverified -->')) continue;
              const markers = issue.body.match(/<!-- seed-health-scope:[0-9a-f]{64}:[0-9a-f]{64} -->/g) || [];
              if (new Set(markers).size !== 1 || markers[0] !== scopeMarker) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Resolved — all configured critical URLs returned complete HTTP 2xx responses within their probe budgets in the latest run. This confirms URL transport only, not extraction or accepted data publication ([logs](${runUrl})). Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Auto-closed resolved health-check issue #${issue.number}`);
            }

      # Always assess all direct prerequisites, even if a health-issue API step
      # failed. The helper decides whether an incident is required; intentional
      # source-plan/bootstrap/preview exclusions are not pipeline failures.
      - name: Create issue on seeding/validation failure
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
          PIPELINE_INPUTS: ${{ toJSON(github.event.inputs) }}
          PIPELINE_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const {report} = require('./.github/scripts/seed_notifications.cjs');
            await report({github, context, core});
