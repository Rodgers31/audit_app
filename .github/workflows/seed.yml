name: Database Seeding & Data Refresh

on:
  # ── Scheduled runs ─────────────────────────────────────────────────
  # Nightly full refresh at 2 AM UTC (5 AM EAT)
  # Weekly deep refresh (bootstrap + all domains) on Sundays at 3 AM UTC
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 0'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to seed (leave empty for all domains)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no database commits)'
        required: false
        type: boolean
        default: false
      run_bootstrap:
        description: 'Also run bootstrap seeding (county data + national data)'
        required: false
        type: boolean
        default: false
      run_validation:
        description: 'Run data validation after seeding'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  # Shared database and seeding configuration
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SEED_RATE_LIMIT: ${{ vars.SEED_RATE_LIMIT || '60/min' }}
  SEED_TIMEOUT_SECONDS: ${{ vars.SEED_TIMEOUT_SECONDS || '30.0' }}
  # Global wall-clock budget for `seed --all` (seconds). Kept below the
  # "Seed all domains" step timeout-minutes (25) so the CLI exits cleanly
  # before GitHub SIGKILLs the step. Bump both together if domains are added.
  SEED_TOTAL_TIMEOUT_SECONDS: ${{ vars.SEED_TOTAL_TIMEOUT_SECONDS || '1320' }}
  SEED_BUDGETS_DATASET_URL: ${{ secrets.SEED_BUDGETS_DATASET_URL }}
  SEED_AUDITS_DATASET_URL: ${{ secrets.SEED_AUDITS_DATASET_URL }}
  # OCR for scanned OAG audit-report PDFs (tesseract-ocr + poppler-utils
  # are apt-installed in the seed job). Opt out by setting the repo
  # Variable SEED_AUDITS_OCR_ENABLED=false.
  SEED_AUDITS_OCR_ENABLED: ${{ vars.SEED_AUDITS_OCR_ENABLED || 'true' }}
  SEED_AUDITS_OCR_MAX_PAGES: ${{ vars.SEED_AUDITS_OCR_MAX_PAGES || '30' }}
  SEED_POPULATION_DATASET_URL: ${{ secrets.SEED_POPULATION_DATASET_URL }}
  SEED_ECONOMIC_INDICATORS_DATASET_URL: ${{ secrets.SEED_ECONOMIC_INDICATORS_DATASET_URL }}
  # KRA FY-revenue page/PDF. The revenue_by_source domain overlays the live
  # per-tax-head breakdown onto the fixture (gated by a plausibility check).
  #
  # This read `vars.SEED_KRA_REVENUE_URL` while the value was stored as a
  # repository SECRET (set 2026-06-14) and no repository Variables exist at
  # all — so it resolved to an empty string on every run and the overlay had
  # never once executed. `secrets` first, `vars` kept as a fallback so either
  # storage location works.
  SEED_KRA_REVENUE_URL: ${{ secrets.SEED_KRA_REVENUE_URL || vars.SEED_KRA_REVENUE_URL }}
  # Listing pages used to DISCOVER the current edition of each periodically
  # republished document, so a new release is ingested automatically instead
  # of the pipeline re-reading a hardcoded path forever.
  SEED_CBK_STATISTICAL_BULLETIN_PAGE_URL: ${{ vars.SEED_CBK_STATISTICAL_BULLETIN_PAGE_URL || 'https://www.centralbank.go.ke/releases/statistical-bulletin/' }}
  SEED_TREASURY_BROP_PAGE_URL: ${{ vars.SEED_TREASURY_BROP_PAGE_URL || 'https://www.treasury.go.ke/budget-review-and-outlook-paper/' }}
  SEED_LOG_LEVEL: INFO

jobs:
  # ══════════════════════════════════════════════════════════════════
  # Step 0: Health-check all government data source URLs
  # Catches broken/migrated URLs BEFORE seeding starts so failures
  # are surfaced immediately instead of buried in log warnings.
  # ══════════════════════════════════════════════════════════════════
  healthcheck:
    name: Data Source Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.check.outputs.report }}
      has_failures: ${{ steps.check.outputs.has_failures }}
    steps:
      - name: Check data source URLs
        id: check
        run: |
          #!/usr/bin/env bash
          # No set -e or pipefail — this script must always exit 0
          # so it never blocks seeding. Failures are reported via outputs.

          # ── Data source registry ──────────────────────────────────
          # Each entry: "LABEL|URL|CRITICAL"
          # CRITICAL=true  → workflow fails and creates an issue
          # CRITICAL=false → logged as warning only
          #
          # COB's slow HTML listings (`/publications/`, `/publications/county-reports/`,
          # `/publications/...-review-reports/`) routinely take 30-50s to render because
          # the WordPress query hits a CDN cache miss on low-traffic paths — they are
          # NOT the primary ingestion path. The real fetcher prefers `/wp-json/wp/v2/media`
          # (reliable, fast) and only falls back to HTML scraping, so the WP REST API
          # is the real "is ingestion healthy?" signal and is the only COB source
          # flagged as CRITICAL here.
          SOURCES=(
            "COB WP REST API|https://cob.go.ke/wp-json/wp/v2/media?per_page=1&mime_type=application/pdf|true"
            "COB Homepage|https://cob.go.ke/|false"
            "COB Publications|https://cob.go.ke/publications/|false"
            "COB County Reports|https://cob.go.ke/publications/county-reports/|false"
            "COB National Reports|https://cob.go.ke/publications/national-government-budget-implementation-review-reports/|false"
            # Same shape as COB above: audits/fetcher.py:199-203 queries the
            # WP media API first and only falls back to scraping the homepage,
            # so the REST endpoint is the real "can we discover reports?"
            # signal.
            "OAG WP REST API|https://www.oagkenya.go.ke/wp-json/wp/v2/media?per_page=1&mime_type=application/pdf|true"
            "OAG Homepage|https://www.oagkenya.go.ke/|true"
            "OAG National Audit Reports|https://www.oagkenya.go.ke/national-government-audit-reports/|false"
            "CBK Homepage|https://www.centralbank.go.ke/|true"
            "CBK Public Debt|https://www.centralbank.go.ke/public-debt/|true"
            # Treasury: www., NOT newsite. The probe used to point at
            # https://newsite.treasury.go.ke/, which appears only in the legacy
            # etl/ pipeline. The nightly runs `seeding.cli seed --all`, and
            # seeding/config.py fetches www.treasury.go.ke. Both hosts answer
            # 200, so the old probe was permanently green about a host this
            # workflow never touches. Kept in sync by
            # backend/tests/test_healthcheck_probes_the_real_hosts.py.
            #
            # budget-books is CRITICAL: it is where the enacted budget for the
            # fiscal year comes from (FY2026/27 = KSh 5,485.7B), so losing it
            # is how a fiscal year silently stops arriving on the site.
            "Treasury Budget Books|https://www.treasury.go.ke/budget-books/|true"
            "Treasury Budget Policy Statement|https://www.treasury.go.ke/budget-policy-statement/|false"
            "Treasury BROP|https://www.treasury.go.ke/budget-review-and-outlook-paper/|false"
            "World Bank API|https://api.worldbank.org/v2/country/KE?format=json|true"
            "IMF DataMapper|https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/KEN|false"
          )

          REPORT=""
          FAILED_CRITICAL=0
          FAILED_WARN=0
          TOTAL=${#SOURCES[@]}
          OK_COUNT=0

          # Primary UA must start with a known HTTP-client identifier
          # (python-httpx / python-requests / curl) so the IMF DataMapper
          # API doesn't 403 us — it filters non-canonical UAs. We append
          # our own identifier + a contact URL for site operators.
          PRIMARY_UA="python-httpx/0.27 KenyaAuditApp-HealthCheck/1.0 (+https://github.com/Rodgers31/audit_app)"
          # Some government WAFs (COB, OAG) intermittently bot-block that UA
          # from datacenter IPs with 403/415/429; a browser UA sometimes
          # gets through, so we re-probe blocked sources with it.
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # $1 = User-Agent, $2 = URL. Follow redirects; 60s timeout (COB's
          # HTML listings legitimately take 30-50s); curl --retry covers
          # connection resets / timeouts (not 4xx). Prints exactly one
          # 3-digit HTTP code.
          #
          # curl writes the code via -w; on a connection failure it prints
          # "000" AND exits non-zero. The old `... || echo "000"` appended a
          # SECOND "000" → "000000", which no longer matches is_transient
          # ("000" exactly) and wrongly escalated genuine outages to the
          # critical branch (see Treasury "000000" in issue #124). Capture
          # stdout, keep the assignment from tripping `set -e` on curl's
          # non-zero exit (|| true), then normalise anything that isn't a
          # bare 3-digit code to "000".
          probe() {
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -L --max-time 60 --retry 2 --retry-delay 3 \
              -A "$1" "$2" 2>/dev/null) || true
            [[ "$code" =~ ^[0-9]{3}$ ]] || code="000"
            printf '%s' "$code"
          }

          # A "transient/blocked" code means the host answered but bot-blocked
          # or rate-limited us (403/415/429), timed out (000), or had a server
          # error (5xx). That is NOT a URL migration — the nightly retry
          # usually clears it — so it never escalates to CRITICAL, even for a
          # source flagged critical. Only genuine 4xx-gone codes (404/410/…)
          # honour the per-source critical flag and can page us.
          is_transient() { [[ "$1" =~ ^(403|415|429|000)$ || "$1" =~ ^5[0-9][0-9]$ ]]; }

          for entry in "${SOURCES[@]}"; do
            IFS='|' read -r label url critical <<< "$entry"

            HTTP_CODE=$(probe "$PRIMARY_UA" "$url")
            # On a block-style code, re-probe once with a browser UA before
            # concluding the source is unhealthy. Adopt the retry code
            # whenever it is DEFINITIVE (i.e. not itself transient): a
            # success (2xx/3xx) means the source is reachable and the block
            # was just our UA, while a genuine 4xx-gone (404/410) revealed
            # past the WAF means the URL migrated and must still surface via
            # the critical-flag branch — not be masked behind the original
            # transient code. Keep the original code only when the re-probe
            # is also transient (the block is real/IP-based, not UA-based).
            if is_transient "$HTTP_CODE"; then
              RETRY_CODE=$(probe "$BROWSER_UA" "$url")
              if ! is_transient "$RETRY_CODE"; then
                HTTP_CODE="$RETRY_CODE"
              fi
            fi

            if [[ "$HTTP_CODE" =~ ^[23] ]]; then
              echo "  [OK]   $label ($HTTP_CODE)"
              REPORT="${REPORT}OK|${label}|${url}|${HTTP_CODE}\n"
              OK_COUNT=$((OK_COUNT + 1))
            elif is_transient "$HTTP_CODE"; then
              echo "  [WARNING] $label → HTTP $HTTP_CODE (transient/blocked) ($url)"
              REPORT="${REPORT}WARNING|${label}|${url}|${HTTP_CODE}\n"
              FAILED_WARN=$((FAILED_WARN + 1))
            else
              severity="WARNING"
              if [ "$critical" = "true" ]; then
                severity="CRITICAL"
                FAILED_CRITICAL=$((FAILED_CRITICAL + 1))
              else
                FAILED_WARN=$((FAILED_WARN + 1))
              fi
              echo "  [${severity}] $label → HTTP $HTTP_CODE ($url)"
              REPORT="${REPORT}${severity}|${label}|${url}|${HTTP_CODE}\n"
            fi
          done

          echo ""
          echo "─── Health Check Summary ───"
          echo "Total: $TOTAL | OK: $OK_COUNT | Critical Failures: $FAILED_CRITICAL | Warnings: $FAILED_WARN"

          # Write outputs for downstream jobs
          # Escape newlines for GitHub Actions output
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "report<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

          if [ "$FAILED_CRITICAL" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

          # Write to step summary
          echo "## Data Source Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Source | URL | HTTP Code |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|-----|-----------|" >> $GITHUB_STEP_SUMMARY
          echo -e "$REPORT" | while IFS='|' read -r status label url code; do
            [ -z "$status" ] && continue
            if [ "$status" = "OK" ]; then
              echo "| ✅ OK | $label | $url | $code |" >> $GITHUB_STEP_SUMMARY
            elif [ "$status" = "CRITICAL" ]; then
              echo "| ❌ CRITICAL | **$label** | $url | $code |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ⚠️ WARNING | $label | $url | $code |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OK:** $OK_COUNT / $TOTAL | **Critical:** $FAILED_CRITICAL | **Warnings:** $FAILED_WARN" >> $GITHUB_STEP_SUMMARY

          # Log a warning annotation if critical sources are down
          if [ "$FAILED_CRITICAL" -gt 0 ]; then
            echo "::warning::$FAILED_CRITICAL critical data source(s) unreachable. Seeding will proceed but may produce incomplete data."
          fi

          # Always exit 0 — health check is informational only.
          # The notify job reads outputs to create GitHub issues.
          exit 0

  # ══════════════════════════════════════════════════════════════════
  # Step 1: Run database migrations
  # ══════════════════════════════════════════════════════════════════
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run alembic migrations
        run: cd backend && alembic upgrade head

      # A migration that "succeeded" is not a schema that matches the models.
      # `alembic stamp --purge` ASSERTS equivalence to a baseline, it never
      # verifies it — which is how public.users sat with 6 of its 9 columns
      # while every nightly reported success, 500ing every authenticated
      # request with `column users.display_name does not exist`. The unit
      # tests cannot catch this either: they build their database with
      # create_all(), so it matches the models by construction.
      #
      # This is the only place the real deployed schema is ever compared to
      # what the ORM will select. It fails the job, which stops seed/validate
      # on `needs:` — correct: writing into a schema the code disagrees with
      # is worse than not writing.
      - name: Verify the deployed schema matches the models
        run: |
          cd backend
          python -c "
          import sys
          from database import engine
          from models import Base
          from services.schema_parity import check_database, format_report

          missing = check_database(engine, Base.metadata)
          print(format_report(missing))
          if missing:
              sys.exit(1)
          "

  # ══════════════════════════════════════════════════════════════════
  # Step 2: Bootstrap seeding (counties, national GDP, population, etc.)
  # Runs on manual trigger with run_bootstrap=true, or on Sunday schedule
  # ══════════════════════════════════════════════════════════════════
  bootstrap:
    name: Bootstrap Reference Data
    # AFTER seed, not beside it. Both write `audits`, and on `needs: migrate`
    # they started within a second of each other every Sunday — the collision
    # that ended run 34008714644 in a statement timeout. Bootstrap now also
    # defers at runtime when it sees a seed run in flight
    # (bootstrap._seed_run_in_flight), so ordering the jobs here is what keeps
    # the weekly refresh from deferring itself into a permanent no-op.
    needs: [migrate, seed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.inputs.run_bootstrap == 'true' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run bootstrap seeding
        run: |
          cd backend
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(name)s %(levelname)s %(message)s')
          from bootstrap import initialize_reference_data
          initialize_reference_data()
          print('Bootstrap seeding completed successfully')
          "

  # ══════════════════════════════════════════════════════════════════
  # Step 3: Domain seeding (economic indicators, debt, budgets, etc.)
  # ══════════════════════════════════════════════════════════════════
  seed:
    name: Seed Data Domains
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      # OCR system deps for scanned OAG audit PDFs (SEED_AUDITS_OCR_ENABLED)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - run: pip install --upgrade pip && pip install -r backend/requirements.txt

      # Persist downloaded source PDFs across runs. The COB county BIRR PDF is
      # ~48MB and the CDN's throughput swings wildly (measured 50s → 556s for
      # the same file); once a report is fetched, later runs reuse the cached
      # copy and skip the download entirely, so a slow-CDN night can't eat the
      # per-domain budget and abort the run (issue #119).
      #
      # Key rotates weekly (ISO year-week) rather than per-run so we don't mint
      # a new ~48MB Actions cache on every nightly run (cache churn / quota).
      # The rolling restore-key means the first run of a week still restores the
      # previous week's snapshot, then re-saves under the new weekly key. BIRR
      # reports are quarterly, so a report published mid-week is at worst
      # re-downloaded (safely, under the wall-clock cap) until the next week's
      # key rotates it into the cache.
      - name: Compute PDF cache period (ISO year-week)
        id: pdf_cache_period
        run: echo "period=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"
      # Split restore/save. `actions/cache` skips its save step entirely when
      # the primary key was an exact hit, and the key here was constant for a
      # whole ISO week — so only the FIRST run of each week could ever add to
      # the cache. Every later run restored that Monday snapshot and
      # re-downloaded anything discovered since:
      #
      #   Cache hit for: seed-pdf-cache-2026-w36
      #   Cache Size: ~43 MB
      #   ... PDF cache miss; streaming download ... (x8, 198s)
      #
      # On 2026-09-06 both nightlies re-fetched the same 66MB — the 29.6MB
      # Treasury PBB alone took 158s — 15% of the global seed budget, on a run
      # that then ran out of budget and dropped four domains. The only cache
      # HIT in either run was a COB PDF 27 days old, i.e. nothing had been
      # saved in a month.
      - name: Restore downloaded source PDFs
        uses: actions/cache/restore@v4
        with:
          path: backend/data/seeding/cache/pdfs
          # Deliberately unmatchable, so the restore always falls through to
          # the prefixes below and picks up the most recent snapshot.
          key: seed-pdf-cache-${{ steps.pdf_cache_period.outputs.period }}-${{ github.run_id }}
          restore-keys: |
            seed-pdf-cache-${{ steps.pdf_cache_period.outputs.period }}-
            seed-pdf-cache-

      - name: Seed all domains
        if: github.event.inputs.domain == '' || github.event.inputs.domain == null
        # Step-level cap below the job's 30-min timeout so the
        # 'Check ingestion job results' step downstream (which runs on
        # `if: always()`) still has room to persist partial-run data
        # before the runner is torn down. Combined with the per-domain
        # timeout in seeding/cli.py, a single stuck domain no longer
        # swallows the whole nightly window.
        timeout-minutes: 25
        run: |
          cd backend
          python -m seeding.cli seed --all ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Seed specific domain
        if: github.event.inputs.domain != '' && github.event.inputs.domain != null
        run: |
          cd backend
          python -m seeding.cli seed --domain ${{ github.event.inputs.domain }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Check ingestion job results
        if: always()
        run: |
          cd backend
          # Quoted heredoc, NOT `python -c "..."`. With python -c the script
          # lives inside a double-quoted shell string, so a single double quote
          # anywhere in the Python terminates it: the shell then parsed the
          # rest as a pipeline ("or: command not found") and Python received a
          # truncated line ("NameError: name 'f' is not defined"). That killed
          # every nightly from 2026-09-03, freezing production data, because
          # the offending line was a routine f-string. <<'PY' quotes nothing.
          python <<'PY'
          import sys
          from database import SessionLocal
          from models import IngestionJob, IngestionStatus
          from datetime import datetime, timedelta

          session = SessionLocal()
          cutoff = datetime.utcnow() - timedelta(minutes=30)
          jobs = session.query(IngestionJob).filter(IngestionJob.started_at >= cutoff).order_by(IngestionJob.id.desc()).all()

          failed = 0
          print('\n--- Ingestion Job Results ---')
          for job in jobs:
              status = job.status.value
              mode = (job.meta or {}).get('source_mode')
              # A domain that served a git-tracked fixture is NOT [OK]: it
              # published nothing from the publisher, and its 0-created count
              # reflects a static file rather than a confirmed no-op upstream.
              if mode == 'fixture':
                  emoji = 'STALE'
              elif status == 'completed':
                  emoji = 'OK'
              elif status == 'completed_with_errors':
                  emoji = 'WARN'
              else:
                  emoji = 'FAIL'
              src = f" | source={mode or 'unrecorded'}"
              reason = (job.meta or {}).get('source_fallback_reason')
              if reason:
                  src += f' ({reason})'
              print(f'[{emoji}] {job.domain}: {status} | created={job.items_created} updated={job.items_updated} processed={job.items_processed}{src}')
              if job.errors:
                  for err in job.errors[:3]:
                      print(f'  ERROR: {str(err)[:200]}')
              if status == 'failed':
                  failed += 1

          session.close()
          if failed > 0:
              print(f'\n{failed} domain(s) failed!')
              sys.exit(1)
          print('\nAll domains completed successfully.')
          PY

      # Cache filenames are sha256(url), so the sorted file list is a stable
      # identity for "which documents are cached". Folding it into the save key
      # means a run that downloaded nothing new writes no cache (the key
      # already exists — this is what kept weekly keys cheap), while a run that
      # fetched a newly-published report does save it, which the weekly key
      # could not.
      - name: Fingerprint the PDF cache
        if: always()
        id: pdf_cache_state
        run: |
          fp=$(find backend/data/seeding/cache/pdfs -maxdepth 1 -name '*.pdf' \
                 -printf '%f\n' 2>/dev/null | sort | sha256sum | cut -c1-16)
          echo "fingerprint=${fp:-empty}" >> "$GITHUB_OUTPUT"
      - name: Save downloaded source PDFs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data/seeding/cache/pdfs
          key: seed-pdf-cache-${{ steps.pdf_cache_period.outputs.period }}-${{ steps.pdf_cache_state.outputs.fingerprint }}

  # ══════════════════════════════════════════════════════════════════
  # Step 4: Data validation — verify tables have data and key metrics are sane
  # ══════════════════════════════════════════════════════════════════
  validate:
    name: Validate Data Integrity
    needs: [seed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs even when seeding failed. The freshness gates report on the state of
    # the DATABASE, which is exactly what an operator needs to see on a bad
    # night — and previously did not: the 2026-09-06 03:19 nightly skipped this
    # job entirely because the seed job was red, so nothing checked whether the
    # published data had gone stale. Keeping it independent is also what lets
    # a truncated seed run report itself as failed (seeding/cli.py) instead of
    # staying green to protect this job.
    if: ${{ !cancelled() && github.event.inputs.run_validation != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Validate seeded data
        run: |
          cd backend
          python -c "
          import sys
          from database import SessionLocal
          from models import (
              Entity, EntityType, Audit, BudgetLine, Loan, PopulationData,
              GDPData, EconomicIndicator, PovertyIndex, DebtTimeline,
              FiscalSummary, FiscalPeriod,
          )
          from sqlalchemy import func

          session = SessionLocal()
          errors = []
          warnings = []

          def check(label, query_count, min_expected, is_warning=False):
              count = query_count
              status = 'OK' if count >= min_expected else ('WARN' if is_warning else 'FAIL')
              print(f'[{status}] {label}: {count} rows (expected >= {min_expected})')
              if count < min_expected:
                  msg = f'{label}: {count} rows (expected >= {min_expected})'
                  if is_warning:
                      warnings.append(msg)
                  else:
                      errors.append(msg)

          # ── Core reference data ──
          check('Counties',
                session.query(Entity).filter(Entity.type == EntityType.COUNTY).count(),
                47)
          check('National Entity',
                session.query(Entity).filter(Entity.type == EntityType.NATIONAL).count(),
                1)
          check('Fiscal Periods',
                session.query(FiscalPeriod).count(),
                1)

          # ── Budget data ──
          check('Budget Lines',
                session.query(BudgetLine).count(),
                400)

          # ── Audit data ──
          # Thresholds are REGRESSION FLOORS, not targets. The honest
          # post-purge baseline is 25 real national/ministry audits (the
          # 512 fabricated county rows were removed 2026-07-07); the live
          # OAG OCR path adds real findings on top over time. Floors sit
          # below 25 so a catastrophic loss still fails the gate, without
          # demanding growth the upstream can't guarantee on any one night.
          # (Pipeline health — did live ingestion actually persist? — is
          # tracked by the ingestion-job counts + the audits-domain
          # fetch↔parse WARN, not by inflating this floor.)
          total_audits = session.query(Audit).count()
          check('Audit Records', total_audits, 20)
          # The provenance middle link. This was 0 for the project's whole
          # history (AUDIT_FINDINGS finding 2); Stage 2's extractor keeps
          # it populated, and losing every extraction row is a hard fail.
          from models import Extraction
          check('Extractions (provenance middle link)',
                session.query(Extraction).count(),
                1)
          check('Publishable audits with extraction provenance',
                session.query(Audit).filter(
                    Audit.extraction_id.isnot(None),
                    Audit.page_ref.isnot(None),
                    Audit.source_hash.isnot(None),
                ).count(),
                1)
          audits_with_year = session.query(Audit).filter(Audit.audit_year.isnot(None)).count()
          check('Audits with audit_year', audits_with_year, 20)
          audits_with_type = session.query(Audit).filter(Audit.query_type.isnot(None)).count()
          check('Audits with query_type', audits_with_type, 20)

          # ── Population data ──
          check('Population Records',
                session.query(PopulationData).count(),
                48)
          check('National Population (entity_id=NULL)',
                session.query(PopulationData).filter(PopulationData.entity_id.is_(None)).count(),
                1)

          # ── GDP data ──
          check('GDP Records (entity-linked)',
                session.query(GDPData).filter(GDPData.entity_id.isnot(None)).count(),
                5)
          check('GDP Records (national, entity_id=NULL)',
                session.query(GDPData).filter(GDPData.entity_id.is_(None)).count(),
                5, is_warning=True)

          # ── Economic indicators ──
          check('Economic Indicators',
                session.query(EconomicIndicator).count(),
                5)
          check('Inflation Rate records',
                session.query(EconomicIndicator).filter(EconomicIndicator.indicator_type == 'inflation_rate').count(),
                1)
          check('Unemployment Rate records',
                session.query(EconomicIndicator).filter(EconomicIndicator.indicator_type == 'unemployment_rate').count(),
                1)

          # ── Poverty data ──
          check('Poverty Index Records',
                session.query(PovertyIndex).count(),
                1, is_warning=True)

          # ── Debt data ──
          check('Loan Records',
                session.query(Loan).count(),
                50)
          check('Debt Timeline',
                session.query(DebtTimeline).count(),
                5, is_warning=True)
          check('Fiscal Summaries',
                session.query(FiscalSummary).count(),
                3, is_warning=True)

          # ── Sanity checks: values in reasonable ranges ──
          latest_pop = session.query(PopulationData).filter(
              PopulationData.entity_id.is_(None)
          ).first()
          if latest_pop and (latest_pop.total_population < 40_000_000 or latest_pop.total_population > 70_000_000):
              errors.append(f'National population out of range: {latest_pop.total_population}')
              print(f'[FAIL] National population sanity check: {latest_pop.total_population}')
          elif latest_pop:
              print(f'[OK] National population sanity: {latest_pop.total_population:,}')

          latest_gdp = session.query(GDPData).filter(
              GDPData.entity_id.is_(None)
          ).order_by(GDPData.year.desc()).first()
          if latest_gdp:
              gdp_trillions = float(latest_gdp.gdp_value) / 1e12
              if gdp_trillions < 5 or gdp_trillions > 30:
                  errors.append(f'National GDP out of range: {gdp_trillions:.1f}T KES')
                  print(f'[FAIL] GDP sanity: {gdp_trillions:.1f}T KES')
              else:
                  print(f'[OK] GDP sanity: {gdp_trillions:.1f}T KES (year {latest_gdp.year})')

          # ── Freshness gates ────────────────────────────────────
          # Row-count floors above ('27 rows >= 20') pass forever and did:
          # they reported [OK] every night for months while audits had not
          # gained a row in 6 weeks and budget_lines in 11. These gates ask
          # the two questions a floor cannot — has the data MOVED, and did
          # the pipeline actually reach the PUBLISHER? See
          # backend/seeding/staleness.py.
          from seeding.staleness import FAIL, WARN, run_all

          print('\n--- Freshness gates ---')
          for finding in run_all(session):
              print(f'  {finding}')
              if finding.level == FAIL:
                  errors.append(f'{finding.label}: {finding.message}')
              elif finding.level == WARN:
                  warnings.append(f'{finding.label}: {finding.message}')

          session.close()

          print(f'\n--- Summary ---')
          print(f'Errors: {len(errors)}, Warnings: {len(warnings)}')
          if errors:
              print('CRITICAL ERRORS:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          if warnings:
              print('Warnings (non-blocking):')
              for w in warnings:
                  print(f'  - {w}')
          print('Data validation passed.')
          "

  # ══════════════════════════════════════════════════════════════════
  # Step 5: Freshness loop (Layer 8) — tell the frontend data changed
  # ══════════════════════════════════════════════════════════════════
  # A new publication must reach the prerendered pages without a deploy.
  # The request body is HMAC-SHA256-signed with REVALIDATE_SECRET (same
  # secret the Next.js /api/revalidate route verifies); the route only
  # accepts allowlisted paths. Runs only after seed AND validate succeed
  # on a non-dry run — never revalidate pages onto unvalidated data.
  revalidate:
    name: Revalidate Frontend Pages
    needs: [seed, validate]
    if: success() && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the revalidation webhook
        env:
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL || 'https://www.auditgava.com/api/revalidate' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET is not configured — prerendered pages will refresh only on their ISR interval. Set the secret here and in Vercel to close the freshness loop."
            exit 0
          fi
          BODY='{"paths":["/","/audits","/budget","/counties","/debt","/sectors","/transparency","/accountability/missing-funds","/sources"]}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$REVALIDATE_SECRET" -r | cut -d' ' -f1)
          HTTP=$(curl -sS -o /tmp/revalidate_response.json -w '%{http_code}' \
            -X POST "$REVALIDATE_URL" \
            -H "content-type: application/json" \
            -H "x-revalidate-signature: $SIG" \
            -d "$BODY")
          cat /tmp/revalidate_response.json
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "::error::Revalidation webhook returned HTTP $HTTP"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════
  # Step 6: Summary and notifications
  # ══════════════════════════════════════════════════════════════════
  notify:
    name: Post-Run Summary
    needs: [healthcheck, seed, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create summary
        run: |
          echo "## Database Seeding Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Run Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Domain** | ${{ github.event.inputs.domain || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bootstrap** | ${{ github.event.inputs.run_bootstrap || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ${{ needs.healthcheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Seed Status** | ${{ needs.seed.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Validation** | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [seeding guide](https://github.com/${{ github.repository }}/blob/main/docs/seeding-guide.md) for details." >> $GITHUB_STEP_SUMMARY

      - name: Create issue on URL health-check failure
        if: needs.healthcheck.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Parse the health-check report to build a readable table
            const report = `${{ needs.healthcheck.outputs.report }}`;
            const lines = report.trim().split('\n').filter(l => l.trim());

            let tableRows = '';
            const failedSources = [];
            for (const line of lines) {
              const parts = line.split('|');
              if (parts.length < 4) continue;
              const [status, label, url, code] = parts;
              if (status === 'CRITICAL' || status === 'WARNING') {
                const icon = status === 'CRITICAL' ? '🔴' : '🟡';
                tableRows += `| ${icon} ${status} | ${label} | ${url} | ${code} |\n`;
                if (status === 'CRITICAL') failedSources.push(label);
              }
            }

            // Check for existing open issue to avoid duplicates
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-source-down',
              state: 'open',
            });

            const today = new Date().toISOString().split('T')[0];
            const title = `⚠️ Data source(s) unreachable: ${failedSources.join(', ')} — ${today}`;
            const body = [
              `## Data Source Health Check Failed`,
              ``,
              `The nightly seeding pipeline detected **${failedSources.length} critical** data source(s) returning errors.`,
              ``,
              `### Affected Sources`,
              ``,
              `| Status | Source | URL | HTTP Code |`,
              `|--------|--------|-----|-----------|`,
              tableRows,
              ``,
              `### What This Means`,
              `- The seeding pipeline still ran, but affected domains may have **stale or missing data**`,
              `- Government websites (OAG, COB, CBK) occasionally restructure their URLs`,
              `- External APIs (World Bank, IMF) may have temporary outages`,
              ``,
              `### Action Required`,
              `1. Check if the URLs load in a browser — if they redirect to a new path, update the fetcher`,
              `2. Look at the [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details`,
              `3. If the site is temporarily down, this issue can be closed — the pipeline retries nightly`,
              `4. If the URL has permanently changed, update the source URLs in:`,
              `   - \`backend/seeding/domains/*/fetcher.py\``,
              `   - \`backend/seeding/config.py\``,
              `   - \`backend/routers/data_provenance.py\``,
              ``,
              `### Common URL Migrations`,
              `| Site | Old Pattern | New Pattern |`,
              `|------|------------|-------------|`,
              `| COB | \`cob.go.ke/reports/\` | \`cob.go.ke/publications/\` |`,
              `| OAG | \`oagkenya.go.ke/reports/\` | \`oagkenya.go.ke/\` (root) |`,
              `| Treasury | \`treasury.go.ke/\` | \`newsite.treasury.go.ke/\` |`,
              ``,
              `---`,
              `*Auto-generated by the Database Seeding & Data Refresh workflow*`,
            ].join('\n');

            // If there's already an open issue with this label, comment on it instead
            if (existingIssues.data.length > 0) {
              const existing = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Update — ${today}\n\nHealth check still failing:\n\n${tableRows}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              console.log(`Commented on existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'data-pipeline', 'data-source-down', 'automated'],
              });
              console.log('Created new health-check failure issue');
            }

      - name: Auto-close resolved health-check issues
        if: needs.healthcheck.outputs.has_failures == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // All critical sources were reachable this run — close any
            // open data-source-down issues so a transient WAF block (415)
            // that self-heals overnight doesn't linger as an open bug.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Require BOTH labels (comma = AND) so we only auto-close
              // issues THIS workflow created — every generated outage issue
              // carries data-source-down + automated. A human-filed
              // investigative issue using only data-source-down is spared.
              labels: 'data-source-down,automated',
              state: 'open',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Resolved — all critical data sources were reachable in the latest run ([logs](${runUrl})). Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Auto-closed resolved health-check issue #${issue.number}`);
            }

      - name: Create issue on seeding/validation failure
        if: needs.seed.result == 'failure' || needs.validate.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const seedResult = '${{ needs.seed.result }}';
            const validateResult = '${{ needs.validate.result }}';
            const failedSteps = [];
            if (seedResult === 'failure') failedSteps.push('Seeding');
            if (validateResult === 'failure') failedSteps.push('Validation');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data pipeline failed: ${failedSteps.join(', ')} — ${new Date().toISOString().split('T')[0]}`,
              body: `## Automated Data Pipeline Failure\n\n` +
                `**Failed Steps:** ${failedSteps.join(', ')}\n` +
                `**Health Check:** ${{ needs.healthcheck.outputs.has_failures == 'true' && '⚠️ Some sources were unreachable (may be related)' || '✅ All sources reachable' }}\n` +
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                `**Triggered by:** ${context.eventName}\n` +
                `**Domain:** ${{ github.event.inputs.domain || 'all' }}\n\n` +
                `### Action Required\n` +
                `1. Check the [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
                `2. Verify the \`ingestion_jobs\` table for domain-level errors\n` +
                `3. If a data source is down, the workflow will retry tomorrow automatically\n` +
                `4. For persistent failures, check if the upstream API/URL has changed\n`,
              labels: ['bug', 'data-pipeline', 'automated']
            });
