# Dedicated persistent local database for scripts/local_dev.py --db postgres.
# Compose starts no app, ETL, proxy, or external connection.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auditgava_local_dev
      POSTGRES_USER: auditgava_dev
      POSTGRES_PASSWORD: auditgava_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - auditgava_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditgava_dev -d auditgava_local_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  auditgava_local_postgres:
